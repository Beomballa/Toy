server:
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: ${SERVER_COMPRESSION_MIN_SIZE:1024}
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
  error:
    include-message: never
    include-stacktrace: never

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:3000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  web:
    resources:
      cache:
        cachecontrol:
          max-age: ${STATIC_CACHE_MAX_AGE:365d}
          cache-public: true
