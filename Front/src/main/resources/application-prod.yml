server:
  shutdown: graceful
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${FRONT_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${FRONT_SESSION_COOKIE_SECURE:true}
        same-site: lax
  compression:
    enabled: true
    min-response-size: ${SERVER_COMPRESSION_MIN_SIZE:1024}
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
  error:
    include-message: never
    include-stacktrace: never

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:3000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  web:
    resources:
      cache:
        cachecontrol:
          max-age: ${STATIC_CACHE_MAX_AGE:365d}
          cache-public: true

front:
  auth:
    max-login-failures: ${FRONT_MAX_LOGIN_FAILURES:5}
    max-ip-login-failures: ${FRONT_MAX_IP_LOGIN_FAILURES:25}
    login-lock-duration: ${FRONT_LOGIN_LOCK_DURATION:15m}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
