<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문서 | Grade Stock</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <link rel="stylesheet" href="/css/commerce.css?v=20260725.1">
</head>
<body data-commerce-page="checkout">
<header class="commerce-header">
    <a class="commerce-logo" href="/front">GS <span>Grade Stock</span></a>
    <nav><a href="/front/cart">장바구니</a><strong>주문서</strong><span>주문 접수</span></nav>
</header>
<main class="commerce-shell">
    <section class="commerce-main">
        <div class="commerce-title"><div><p>Checkout</p><h1>주문서</h1></div><span id="commerceItemCount">0개 상품</span></div>
        <div class="checkout-products" id="commerceCartList" aria-live="polite"></div>
        <form class="checkout-form" id="checkoutForm">
            <fieldset><legend>주문자 정보</legend><div class="form-grid"><label>이름<input name="buyerName" required maxlength="50"></label><label>연락처<input name="buyerPhone" required maxlength="20" inputmode="tel" placeholder="010-0000-0000"></label></div></fieldset>
            <fieldset><legend>배송지 정보</legend><label class="same-buyer"><input type="checkbox" id="sameBuyerCheck"> 주문자와 동일</label><div class="form-grid"><label>받는 분<input name="recipientName" required maxlength="50"></label><label>연락처<input name="recipientPhone" required maxlength="20" inputmode="tel"></label><label>우편번호<input name="postalCode" required maxlength="10" inputmode="numeric"></label><label class="wide">주소<input name="address1" required maxlength="200"></label><label class="wide">상세 주소<input name="address2" maxlength="200"></label><label class="wide">배송 요청사항<input name="deliveryRequest" maxlength="200" placeholder="문 앞에 놓아주세요"></label></div></fieldset>
        </form>
    </section>
    <aside class="commerce-summary">
        <h2>최종 주문 금액</h2>
        <dl><div><dt>상품 금액</dt><dd id="commerceSubtotal">0원</dd></div><div><dt>배송비</dt><dd>무료</dd></div><div class="total"><dt>총 주문 금액</dt><dd id="commerceTotal">0원</dd></div></dl>
        <button class="commerce-primary" type="submit" form="checkoutForm" id="submitOrderButton">주문 접수하기</button>
        <p>현재 데모에서는 PG 결제 없이 주문 접수 상태로 저장됩니다.</p>
    </aside>
</main>
<section class="order-complete" id="orderComplete" hidden><div><p>Order Complete</p><h1>주문이 접수되었습니다.</h1><strong id="completedOrderNumber"></strong><span id="completedOrderAmount"></span><a href="/front">쇼핑 계속하기</a></div></section>
<div class="commerce-toast" id="commerceToast" role="status" aria-live="polite" hidden></div>
<script src="/js/view/commerce.js?v=20260725.1"></script>
</body>
</html>
