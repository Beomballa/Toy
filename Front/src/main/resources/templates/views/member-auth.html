<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | NOREN</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <link rel="stylesheet" href="/css/storefront-shell.css?v=20260804.1">
    <link rel="stylesheet" href="/css/member-auth.css?v=20260804.2">
</head>
<body class="storefront-page member-auth-page">
<a class="member-auth-skip" href="#memberAuthMain">본문 바로가기</a>
<header th:replace="~{fragments/storefront-shell :: header('MY', 'MEMBER ACCESS')}"></header>
<main class="member-auth" id="memberAuthMain" tabindex="-1">
    <section class="member-auth__intro">
        <p>NOREN MEMBERSHIP</p>
        <h1>취향을 저장하고<br>어디서든 이어보세요.</h1>
        <span>관심 상품, 최근 탐색과 주문 흐름을 안전하게 연결합니다.</span>
        <dl>
            <div><dt>01</dt><dd>브라우저가 달라도 이어지는 관심 상품</dd></div>
            <div><dt>02</dt><dd>개인 계정으로 보호되는 주문과 활동</dd></div>
            <div><dt>03</dt><dd>필요할 때만 전달하는 서비스 안내</dd></div>
        </dl>
    </section>

    <section class="member-auth__panel" aria-labelledby="memberAuthTitle">
        <div class="member-auth__signed" id="memberSignedPanel" hidden>
            <p>WELCOME BACK</p>
            <h2 id="memberSignedName">회원님</h2>
            <span id="memberSignedEmail"></span>
            <div><a href="/front/my">MY 쇼핑 활동</a><button type="button" id="memberLogoutButton">로그아웃</button></div>
        </div>

        <div id="memberAnonymousPanel">
            <div class="member-auth__tabs" role="tablist" aria-label="회원 인증 방식">
                <button type="button" role="tab" id="memberLoginTab" aria-controls="memberLoginForm" aria-selected="true">로그인</button>
                <button type="button" role="tab" id="memberSignUpTab" aria-controls="memberSignUpForm" aria-selected="false">회원가입</button>
            </div>
            <h2 class="member-auth__title" id="memberAuthTitle">다시 만나 반갑습니다.</h2>
            <p class="member-auth__description" id="memberAuthDescription">가입한 이메일로 로그인하세요.</p>
            <p class="member-auth__status" id="memberAuthStatus" role="alert" hidden></p>

            <form class="member-auth__form" id="memberLoginForm" novalidate>
                <label>이메일<input name="email" type="email" autocomplete="username" maxlength="255" required placeholder="name@example.com"></label>
                <label>비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="100" required></label>
                <button type="submit">로그인</button>
            </form>

            <form class="member-auth__form" id="memberSignUpForm" hidden novalidate>
                <label>이메일<input name="email" type="email" autocomplete="email" maxlength="255" required placeholder="name@example.com"></label>
                <label>이름<input name="name" type="text" autocomplete="name" maxlength="100" required></label>
                <label>닉네임 <span>선택</span><input name="nickname" type="text" autocomplete="nickname" maxlength="100"></label>
                <label>비밀번호 <span>영문과 숫자를 포함한 8자 이상</span><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
                <label>비밀번호 확인<input name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
                <button type="submit">NOREN 시작하기</button>
            </form>
            <p class="member-auth__policy">회원가입 시 서비스 이용약관과 개인정보 처리방침에 동의한 것으로 간주합니다.</p>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/storefront-shell :: footer}"></footer>
<script src="/js/view/storefront-state.js?v=20260805.2"></script>
<script src="/js/view/storefront-shell.js?v=20260802.1"></script>
<script src="/js/view/member-auth.js?v=20260805.2"></script>
</body>
</html>
