<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 조회 | Grade Stock</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <link rel="stylesheet" href="/css/commerce.css?v=20260727.1">
    <link rel="stylesheet" href="/css/storefront-shell.css?v=20260726.2">
</head>
<body class="order-lookup-body storefront-page" th:attr="data-order-number=${orderNumber}">
<header th:replace="~{fragments/storefront-shell :: header('MY', '주문 조회')}"></header>
<main class="order-lookup-shell">
    <section class="order-lookup-intro">
        <p>Order Tracking</p>
        <h1>주문 상태 조회</h1>
        <span>주문번호와 주문 시 입력한 연락처를 함께 확인합니다.</span>
        <form id="orderLookupForm">
            <label>주문번호<input name="orderNumber" th:value="${orderNumber}" required autocomplete="off" maxlength="42" placeholder="GS로 시작하는 주문번호"></label>
            <label>주문자 연락처<input name="phone" required inputmode="tel" autocomplete="tel" maxlength="20" pattern="[0-9() -]{10,20}" placeholder="010-0000-0000"></label>
            <button type="submit"><span>주문 조회</span></button>
        </form>
        <div class="order-lookup-tools"><button type="button" id="loadRecentOrderButton">최근 주문 불러오기</button><button type="button" id="clearOrderLookupButton">입력 초기화</button></div>
        <p class="order-lookup-error" id="orderLookupError" role="alert" hidden></p>
    </section>

    <section class="order-result" id="orderResult" hidden aria-live="polite">
        <div class="order-result__head">
            <div><p>Order Detail</p><h2 id="orderResultNumber"></h2><span id="orderResultDate"></span></div>
            <div class="order-result__actions"><strong id="orderResultStatus"></strong><button type="button" id="copyOrderNumberButton">주문번호 복사</button><button type="button" id="printOrderButton">인쇄</button></div>
        </div>
        <ol class="order-progress" id="orderProgress" aria-label="주문 처리 단계">
            <li>주문 접수</li><li>결제 확인</li><li>배송 준비</li><li>배송 중</li><li>배송 완료</li>
        </ol>
        <div class="order-result__grid">
            <section><div class="order-section-title"><h3>주문 상품</h3><span id="orderItemSummary"></span></div><div id="orderItems"></div></section>
            <aside>
                <h3>배송 정보</h3>
                <dl id="orderDelivery"></dl>
                <h3>결제 정보</h3>
                <dl><div><dt>총 주문 금액</dt><dd id="orderTotalAmount"></dd></div></dl>
                <div class="order-tracking" id="orderTracking" hidden><span id="orderTrackingText"></span><button type="button" id="copyTrackingButton">송장번호 복사</button></div>
            </aside>
        </div>
        <section class="order-history"><h3>처리 이력</h3><ol id="orderHistory"></ol></section>
    </section>
</main>
<div class="commerce-toast" id="commerceToast" role="status" aria-live="polite" hidden></div>
<footer th:replace="~{fragments/storefront-shell :: footer}"></footer>
<script src="/js/view/storefront-state.js?v=20260726.1"></script>
<script src="/js/view/storefront-shell.js?v=20260726.2"></script>
    <script src="/js/view/order-lookup.js?v=20260802.1"></script>
</body>
</html>
