<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 컬렉션 | NOREN</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <link rel="stylesheet" href="/css/main.css?v=20260718.23">
    <link rel="stylesheet" href="/css/storefront.css?v=20260725.2">
    <link rel="stylesheet" href="/css/product-collection.css?v=20260820.3">
    <link rel="stylesheet" href="/css/storefront-shell.css?v=20260813.1">
</head>
<body class="collection-body storefront-page" th:attr="data-collection-type=${collectionType}">
<a class="skip-link" href="#collectionMain">상품 목록 바로가기</a>
<header th:replace="~{fragments/storefront-shell :: header('SHOP', '상품 컬렉션')}"></header>
<div class="collection-shell">
    <main id="collectionMain">
        <section class="collection-hero" aria-labelledby="collectionTitle">
            <div>
                <p id="collectionEyebrow">Collection</p>
                <h1 id="collectionTitle">상품 컬렉션</h1>
                <p id="collectionDescription">선별된 상품을 불러오고 있습니다.</p>
            </div>
            <dl class="collection-hero__metrics" aria-label="컬렉션 결과">
                <div><dt>상품</dt><dd id="collectionTotalCount">0</dd></div>
                <div><dt>페이지</dt><dd id="collectionPageCount">0</dd></div>
            </dl>
        </section>

        <form class="collection-toolbar" id="collectionSearchForm" role="search" aria-label="컬렉션 상품 검색 및 정렬">
            <label>
                <span>컬렉션 검색</span>
                <input id="collectionSearchInput" type="search" placeholder="상품명, 브랜드, 모델번호" autocomplete="off">
            </label>
            <label>
                <span>정렬</span>
                <select id="collectionSortSelect">
                    <option value="DEFAULT">컬렉션 기본순</option>
                    <option value="PRICE_LOW">가격 낮은 순</option>
                    <option value="PRICE_HIGH">가격 높은 순</option>
                    <option value="STOCK_DESC">재고 많은 순</option>
                    <option value="LATEST">최근 등록순</option>
                </select>
            </label>
            <button type="submit" id="collectionSearchButton">검색</button>
            <button type="button" id="collectionFilterButton" aria-expanded="false" aria-controls="collectionFilterDialog">필터 <span id="collectionFilterCount">0</span></button>
            <button type="button" id="collectionResetButton">초기화</button>
        </form>

        <dialog class="collection-filter" id="collectionFilterDialog" aria-labelledby="collectionFilterTitle">
            <form method="dialog" class="collection-filter__head">
                <div><p>DISCOVERY FILTER</p><h2 id="collectionFilterTitle">상세 조건</h2><span>현재 컬렉션의 기본 조건은 그대로 유지됩니다.</span></div>
                <button type="submit" id="collectionFilterCloseButton" aria-label="필터 닫기">닫기</button>
            </form>
            <form id="collectionFilterForm" class="collection-filter__form">
                <label>브랜드<input id="collectionBrandInput" name="brand" type="search" maxlength="80" placeholder="예: 나이키" autocomplete="off"></label>
                <label>카테고리<input id="collectionCategoryInput" name="category" type="search" maxlength="80" placeholder="예: 스니커즈" autocomplete="off"></label>
                <label>재고 상태<select id="collectionStockSelect" name="stock"><option value="ALL">전체</option><option value="STABLE">구매 가능</option><option value="LOW">재고 주의</option></select></label>
                <label>가격대<select id="collectionPriceBandSelect" name="priceBand"><option value="ALL">전체</option><option value="UNDER_200">20만원 미만</option><option value="BETWEEN_200_300">20~30만원</option><option value="OVER_300">30만원 초과</option></select></label>
                <label>재고 주의 기준<select id="collectionLowStockThreshold" name="lowStockThreshold"><option value="20">20개 미만</option><option value="10">10개 미만</option><option value="30">30개 미만</option><option value="50">50개 미만</option></select></label>
                <label class="collection-filter__toggle"><input id="collectionFeaturedOnly" name="featuredOnly" type="checkbox"> 대표 상품만 보기</label>
                <p class="collection-filter__locked" id="collectionFilterLocked" hidden></p>
                <div class="collection-filter__actions"><button type="button" id="collectionFilterResetButton">조건 지우기</button><button type="submit" id="collectionFilterApplyButton">적용하기</button></div>
            </form>
        </dialog>

        <div class="collection-result-head">
            <p id="collectionResultText" role="status" aria-live="polite">상품을 불러오고 있습니다.</p>
            <span id="collectionRangeText">0 / 0</span>
        </div>
        <div class="collection-filter-summary" id="collectionFilterSummary" aria-live="polite" hidden></div>

        <section class="collection-grid" id="collectionGrid" aria-label="컬렉션 상품 목록" aria-busy="true"></section>

        <dialog class="collection-quick-view" id="collectionQuickView" aria-labelledby="collectionQuickViewTitle">
            <button type="button" id="collectionQuickViewClose" aria-label="빠른 보기 닫기">닫기</button>
            <div id="collectionQuickViewContent" aria-live="polite"><p>상품 정보를 불러오고 있습니다.</p></div>
        </dialog>

        <nav class="collection-pagination" aria-label="컬렉션 페이지 이동">
            <button type="button" id="collectionFirstButton">처음</button>
            <button type="button" id="collectionPreviousButton">이전</button>
            <strong id="collectionPaginationText">1 / 1</strong>
            <label class="collection-pagination__select">페이지 선택<select id="collectionPageSelect" aria-label="컬렉션 페이지 선택"></select></label>
            <button type="button" id="collectionNextButton">다음</button>
            <button type="button" id="collectionLastButton">마지막</button>
        </nav>
    </main>

</div>
<footer th:replace="~{fragments/storefront-shell :: footer}"></footer>
<script src="/js/view/storefront-state.js?v=20260805.2"></script>
<script src="/js/view/storefront-shell.js?v=20260802.1"></script>
<script src="/js/view/product-collection.js?v=20260820.3"></script>
</body>
</html>
