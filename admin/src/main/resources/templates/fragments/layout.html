<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 사이드바 fragment -->
<nav th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon" id="main-logo">GS</div>
        <div class="sidebar-brand-text">Grade Stock</div>
    </div>

    <div class="nav-section">
        <div class="nav-section-title">Main Menu</div>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('dashboard') ? 'active' : ''}" href="/admin/dashboard">
            <i class="fas fa-chart-line"></i> 대시보드
        </a>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('product') ? 'active' : ''}" href="/admin/products">
            <i class="fas fa-box"></i> 상품 관리
        </a>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('market') ? 'active' : ''}" href="/admin/market">

        </a>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('orders') ? 'active' : ''}" href="/admin/orders">

        </a>

    <div class="nav-section">

        <a class="nav-link" href="/admin/settings"><i class="fas fa-cog"></i> 시스템 설정</a>
    </div>

</html>
