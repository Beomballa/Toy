<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!-- 사이드바 fragment -->
<nav th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon" id="main-logo">GS</div>
        <div class="sidebar-brand-text">Grade Stock</div>
    </div>

    <div class="nav-section">
        <div class="nav-section-title">Main Menu</div>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('dashboard') ? 'active' : ''}" href="/admin/dashboard">
            <i class="fas fa-chart-line"></i> 대시보드
        </a>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('products') ? 'active' : ''}" href="/admin/products">
            <i class="fas fa-box"></i> 상품 관리
        </a>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('brands') ? 'active' : ''}" href="/admin/brands">
            <i class="fas fa-tag"></i> 브랜드 관리
        </a>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('categories') ? 'active' : ''}" href="/admin/categories">
            <i class="fas fa-sitemap"></i> 카테고리 관리
        </a>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('banners') ? 'active' : ''}" href="/admin/banners">
            <i class="fas fa-image"></i> 배너 관리
        </a>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('orders') ? 'active' : ''}" href="/admin/orders">
            <i class="fas fa-shopping-cart"></i> 주문 관리
        </a>
    </div>

    <div class="nav-section">
        <div class="nav-section-title">Community</div>
        <a class="nav-link"
           th:classappend="${currentUri != null
                && currentUri.contains('/admin/content')
                && (currentBoardType == null || #strings.equals(currentBoardType, 'NOTICE')) ? 'active' : ''}"
           href="/admin/content/list">
            <i class="fas fa-edit"></i> 콘텐츠 관리
        </a>
        <a class="nav-link"
           th:classappend="${#strings.equals(currentBoardType, 'STYLE') ? 'active' : ''}"
           href="/admin/content/list?boardType=STYLE">
            <i class="fas fa-camera"></i> 스타일 피드
        </a>
        <a class="nav-link"
           th:classappend="${#strings.equals(currentBoardType, 'DISCUSS') ? 'active' : ''}"
           href="/admin/content/list?boardType=DISCUSS">
            <i class="fas fa-comments"></i> 종목 토론방
        </a>
        <a class="nav-link"
           th:classappend="${#strings.equals(currentBoardType, 'QNA') ? 'active' : ''}"
           href="/admin/content/list?boardType=QNA">
            <i class="fas fa-circle-question"></i> 문의사항
        </a>
        <a class="nav-link" href="/admin/members"><i class="fas fa-users"></i> 회원 관리</a>
    </div>

    <div class="nav-section">
        <div class="nav-section-title">System</div>
        <a class="nav-link" th:classappend="${currentUri != null && currentUri.contains('settings/logs') ? 'active' : ''}" href="/admin/settings/logs">
            <i class="fas fa-history"></i> 활동 로그 확인
        </a>
        <a class="nav-link" href="/admin/settings"><i class="fas fa-cog"></i> 시스템 설정</a>
    </div>
</nav>

</html>
