<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리 활동 로그 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item">System</li>
                <li class="breadcrumb-item active">Activity Logs</li>
            </ol>
        </nav>
        <h1 class="page-title">관리 활동 로그</h1>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="form-label fw-bold">관리자 번호</label>
                    <input type="number" min="1" id="logAdminNo" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">작업 종류</label>
                    <input type="text" id="logActionType" class="form-control" placeholder="PRODUCT_UPDATE">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">대상 ID</label>
                    <input type="number" min="1" id="logTargetId" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">시작일</label>
                    <input type="date" id="logStartDate" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">종료일</label>
                    <input type="date" id="logEndDate" class="form-control">
                </div>
                <div class="col-md-2 d-grid">
                    <button type="button" class="btn btn-dark" id="btnSearchLog">조회</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="card-title mb-0">활동 내역</h6>
            <div class="small text-muted" id="logMetaText">데이터를 불러오는 중입니다...</div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">No</th>
                            <th>관리자 No</th>
                            <th>작업 종류</th>
                            <th>대상</th>
                            <th>IP 주소</th>
                            <th class="text-center">상세</th>
                            <th class="text-end pe-4">일시</th>
                        </tr>
                    </thead>
                    <tbody id="logListBody">
                        <tr><td colspan="7" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="logDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">로그 상세</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="logDetailBody">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/admin-logs.js"></script>
</body>
</html>
