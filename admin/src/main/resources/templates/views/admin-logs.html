<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리 활동 로그 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item">System</li>
                <li class="breadcrumb-item active">Activity Logs</li>
            </ol>
        </nav>
        <h1 class="page-title">관리 활동 로그</h1>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3">
            <h6 class="card-title mb-0">활동 내역</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">No</th>
                            <th>관리자 No</th>
                            <th>작업 종류</th>
                            <th>대상 ID</th>
                            <th>IP 주소</th>
                            <th class="text-end pe-4">일시</th>
                        </tr>
                    </thead>
                    <tbody id="logListBody">
                        <tr><td colspan="6" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
    const AdminLog = {
        init() {
            this.getList();
        },
        async getList() {
            try {
                const res = await fetch('/api/admin/logs/list');
                const data = await res.json();
                this.renderList(data.content);
            } catch (err) {
                console.error('로그 로드 실패:', err);
            }
        },
        renderList(items) {
            const tbody = document.getElementById('logListBody');
            if (!items || items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5">활동 로그가 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = items.map(item => `
                <tr>
                    <td class="ps-4 text-muted small">${item.logNo}</td>
                    <td><span class="badge bg-light text-dark">Admin #${item.adminNo}</span></td>
                    <td><span class="fw-bold text-primary">${item.actionType}</span></td>
                    <td>${item.targetId || '-'}</td>
                    <td><code class="small">${item.ipAddress}</code></td>
                    <td class="text-end pe-4 small text-muted">${item.actionDtm.replace('T', ' ')}</td>
                </tr>
            `).join('');
        }
    };
    document.addEventListener('DOMContentLoaded', () => AdminLog.init());
</script>
</body>
</html>
