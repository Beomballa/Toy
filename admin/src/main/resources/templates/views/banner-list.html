<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배너 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .banner-preview-img { width: 120px; height: 60px; object-fit: cover; border: 1px solid #e5e7eb; border-radius: 8px; }
        .badge-y { background: rgba(49, 196, 141, 0.1); color: #057a55; }
        .badge-n { background: rgba(240, 82, 82, 0.1); color: #c81e1e; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item active">배너 관리</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <h1 class="page-title">배너 관리</h1>
            <button type="button" class="btn btn-primary" id="btnNewBanner"><i class="fas fa-plus me-2"></i>신규 배너 등록</button>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3">
            <h6 class="card-title mb-0">배너 목록</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4" style="width: 80px;">순서</th>
                            <th style="width: 150px;">미리보기</th>
                            <th>제목</th>
                            <th>노출 기간</th>
                            <th class="text-center" style="width: 100px;">상태</th>
                            <th class="text-end pe-4" style="width: 150px;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="bannerListBody">
                        <tr><td colspan="6" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- 배너 등록/수정 모달 -->
<div class="modal fade" id="bannerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="bannerModalTitle">배너 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="bannerForm">
                    <input type="hidden" id="bannerNo">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">배너 제목</label>
                            <input type="text" id="title" class="form-control" placeholder="관리용 제목을 입력하세요" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">이미지 URL</label>
                            <input type="text" id="imageUrl" class="form-control" placeholder="https://..." required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">시작 일시</label>
                            <input type="datetime-local" id="startDtm" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">종료 일시</label>
                            <input type="datetime-local" id="endDtm" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">정렬 순서</label>
                            <input type="number" id="sortOrder" class="form-control" value="0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">사용 여부</label>
                            <select id="isActive" class="form-select">
                                <option value="Y">사용중</option>
                                <option value="N">중지</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold">이동 URL (선택)</label>
                            <input type="text" id="targetUrl" class="form-control" placeholder="/product/get?no=...">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="btnSaveBanner">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/banner-list.js"></script>
</body>
</html>
