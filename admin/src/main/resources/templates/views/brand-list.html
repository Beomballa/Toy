<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브랜드 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .brand-logo-img { width: 48px; height: 48px; object-fit: contain; border: 1px solid #e5e7eb; border-radius: 8px; padding: 4px; background: white; }
        .brand-logo-wrapper { width: 48px; height: 48px; position: relative; }
        .brand-logo-fallback { width: 48px; height: 48px; background: #f3f4f6; color: #9ca3af; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; border: 1px solid #e5e7eb; }
        .badge-y { background: rgba(49, 196, 141, 0.1); color: #057a55; }
        .badge-n { background: rgba(240, 82, 82, 0.1); color: #c81e1e; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item active">브랜드 관리</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <h1 class="page-title">브랜드 관리</h1>
            <button type="button" class="btn btn-primary" id="btnNewBrand"><i class="fas fa-plus me-2"></i>신규 브랜드 등록</button>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3">
            <h6 class="card-title mb-0">브랜드 목록</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4" style="width: 80px;">No</th>
                            <th style="width: 100px;">로고</th>
                            <th>브랜드명(한글)</th>
                            <th>브랜드명(영문)</th>
                            <th class="text-center" style="width: 120px;">상태</th>
                            <th class="text-end pe-4" style="width: 150px;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="brandListBody">
                        <tr><td colspan="6" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="brandModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title fw-bold" id="brandModalTitle">브랜드 등록</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="brandForm">
                    <input type="hidden" id="brandNo">
                    <div class="mb-3"><label class="form-label fw-bold">브랜드명 (한글)</label><input type="text" id="nameKo" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label fw-bold">브랜드명 (영문)</label><input type="text" id="nameEn" class="form-control"></div>
                    <div class="mb-3"><label class="form-label fw-bold">로고 URL</label><input type="text" id="logoUrl" class="form-control"></div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">사용 여부</label>
                        <select id="isActive" class="form-select">
                            <option value="Y">사용중</option>
                            <option value="N">중지</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button><button type="button" class="btn btn-primary" id="btnSaveBrand">저장</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/brand-list.js"></script>
</body>
</html>
