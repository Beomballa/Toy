<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카테고리 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item active">카테고리 관리</li>
            </ol>
        </nav>
        <div class="page-title-wrapper"><h1 class="page-title">카테고리 관리</h1></div>
    </div>

    <div class="row g-4 animate-in">
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="card-title mb-0">대분류 (1차)</h6>
                    <button class="btn btn-sm btn-outline-primary" id="btnNewRootCategory">추가</button>
                </div>
                <div class="card-body border-bottom py-3">
                    <div class="row g-2 align-items-end">
                        <div class="col-7">
                            <label class="form-label fw-bold">카테고리 검색</label>
                            <input type="text" id="categoryKeyword" class="form-control" placeholder="카테고리명 검색">
                        </div>
                        <div class="col-3">
                            <label class="form-label fw-bold">상태</label>
                            <select id="categoryIsActiveFilter" class="form-select">
                                <option value="">전체</option>
                                <option value="Y">사용</option>
                                <option value="N">중지</option>
                            </select>
                        </div>
                        <div class="col-2 d-grid gap-2">
                            <button type="button" class="btn btn-dark btn-sm" id="btnSearchCategory">조회</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnResetCategory">초기화</button>
                        </div>
                    </div>
                </div>
                <div class="card-body border-bottom py-2">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div class="small text-muted" id="categoryFilterMeta">적용 필터를 계산하는 중입니다...</div>
                        <div class="small text-muted" id="categoryResultMeta">결과 메타를 계산하는 중입니다...</div>
                    </div>
                </div>
                <div class="card-body panel-scroll-y" id="depth1Body">
                    <div class="text-center py-5 text-muted">데이터를 불러오는 중입니다...</div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="card-title mb-0">중분류 (2차) <span id="parentCategoryName" class="text-primary ms-2"></span></h6>
                    <button class="btn btn-sm btn-primary" id="btnNewSubCategory" disabled onclick="CategoryList.openModal(2)">
                        <i class="fas fa-plus me-1"></i>추가
                    </button>
                </div>
                <div class="card-body border-bottom py-2">
                    <div class="small text-muted" id="subCategoryMetaText">대분류를 선택하면 하위 카테고리 메타가 표시됩니다.</div>
                </div>
                <div class="card-body p-0 panel-min-h-500" id="depth2Body">
                    <div class="text-center py-5 text-muted" id="depth2EmptyMessage">대분류를 선택하면 하위 카테고리가 표시됩니다.</div>
                    <div class="table-responsive d-none" id="depth2TableWrapper">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4 table-col-80">No</th>
                                    <th>카테고리명</th>
                                    <th class="text-center table-col-120">상태</th>
                                    <th class="text-end pe-4 table-col-150">관리</th>
                                </tr>
                            </thead>
                            <tbody id="depth2ListBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title fw-bold" id="categoryModalTitle">카테고리 관리</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="categoryForm">
                    <input type="hidden" id="categoryNo"><input type="hidden" id="parentNo"><input type="hidden" id="depth">
                    <div class="mb-3 hidden-default" id="parentNameWrapper"><label class="form-label text-muted small">상위 카테고리</label><div id="parentDisplay" class="fw-bold"></div></div>
                    <div class="mb-3"><label class="form-label fw-bold">카테고리명</label><input type="text" id="categoryName" class="form-control" required></div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">사용 여부</label>
                        <select id="isCategoryActive" class="form-select">
                            <option value="Y">사용중</option>
                            <option value="N">중지</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button><button type="button" class="btn btn-primary" id="btnSaveCategory">저장</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/category-list.js"></script>
</body>
</html>
