<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘텐츠 편집 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .notion-title { border: none; font-size: 2.5rem; font-weight: 700; padding: 0; }
        .notion-title:focus { box-shadow: none; }
        .notion-content { border: none; font-size: 1.1rem; padding: 0; resize: none; }
        .notion-content:focus { box-shadow: none; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <form id="contentEditForm">
        <input type="hidden" id="contentId" th:value="${id}">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div class="d-flex align-items-center gap-3">
                <select id="boardType" class="form-select form-select-sm" style="width: auto;">
                    <option th:each="type : ${boardTypes}" th:value="${type}" th:text="${type}"></option>
                </select>
                <span id="saveStatus" class="text-muted small"></span>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-outline-secondary" onclick="location.href='/admin/content/list'">목록</button>
                <button type="button" class="btn btn-primary" id="btnSave">저장</button>
                <button type="button" class="btn btn-danger" id="btnDelete" th:if="${id != null}">삭제</button>
            </div>
        </div>
        <div class="mb-3"><input type="text" id="title" class="form-control notion-title" placeholder="제목을 입력하세요"></div>
        <div class="mb-3"><textarea id="content" class="form-control notion-content" rows="15" placeholder="내용을 입력하세요..."></textarea></div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/content-edit.js"></script>
</body>
</html>
