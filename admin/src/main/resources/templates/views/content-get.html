<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 상세 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content admin-page-shell detail-main">
    <div class="detail-scroll-content content-detail-page admin-detail-page">
        <div class="page-header content-detail-header admin-detail-header">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                    <li class="breadcrumb-item"><a id="contentListBreadcrumbLink" th:href="@{/admin/content/list(boardType=${boardType})}">커뮤니티</a></li>
                    <li class="breadcrumb-item active" id="contentDetailBreadcrumb">상세</li>
                </ol>
            </nav>
            <div class="page-title-wrapper content-detail-titlebar admin-detail-titlebar">
                <div class="content-detail-heading admin-detail-heading">
                    <div class="content-detail-eyebrow admin-detail-eyebrow" id="contentDetailBadge">NOTICE</div>
                    <h1 class="page-title" id="contentDetailTitle">콘텐츠 상세</h1>
                    <div class="content-detail-submeta admin-detail-submeta">
                        <span class="content-detail-meta-chip admin-detail-meta-chip" id="contentCreatedMeta">등록 -</span>
                        <span class="content-detail-meta-chip admin-detail-meta-chip" id="contentUpdatedMeta">수정 -</span>
                        <span class="content-detail-meta-chip admin-detail-meta-chip" id="contentViewsMeta">조회 -</span>
                    </div>
                </div>
                <div class="content-detail-actions admin-detail-actions">
                    <button type="button" class="btn btn-secondary" id="btnBackToList">
                        <i class="fas fa-list me-2"></i>목록
                    </button>
                    <button type="button" class="btn btn-primary" id="btnEditContent">
                        <i class="fas fa-pen-to-square me-2"></i>수정
                    </button>
                    <button type="button" class="btn btn-danger" id="btnDeleteContent">
                        <i class="fas fa-trash me-2"></i>삭제
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4 content-detail-layout admin-detail-layout">
            <div class="col-xl-8">
                <div class="card content-detail-card admin-detail-card">
                    <div class="card-body content-detail-body admin-detail-body">
                        <div class="content-detail-title-block admin-detail-title-block">
                            <span class="content-detail-label admin-detail-label">제목</span>
                            <h2 id="contentTitleValue" class="content-detail-headline admin-detail-headline">-</h2>
                        </div>
                        <div class="content-detail-divider admin-detail-divider"></div>
                        <div class="content-detail-copy-wrap admin-detail-copy-wrap">
                            <span class="content-detail-label admin-detail-label">본문</span>
                            <div id="contentBodyValue" class="content-detail-copy admin-detail-copy">내용을 불러오는 중입니다.</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-4">
                <div class="card content-detail-side-card admin-detail-side-card">
                    <div class="card-header content-detail-side-header admin-detail-side-header"><span class="card-title">게시 정보</span></div>
                    <div class="card-body content-detail-side-body admin-detail-side-body">
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">게시판</span>
                            <strong id="contentBoardLabel">-</strong>
                        </div>
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">문서번호</span>
                            <strong id="contentIdValue">-</strong>
                        </div>
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">연결 상품번호</span>
                            <strong id="contentProductNoValue">-</strong>
                        </div>
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">게시 상태</span>
                            <strong id="contentStatusValue">-</strong>
                        </div>
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">공개 여부</span>
                            <strong id="contentPublicValue">-</strong>
                        </div>
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">고정글 여부</span>
                            <strong id="contentPinnedValue">-</strong>
                        </div>
                    </div>
                </div>
                <div class="card content-detail-side-card admin-detail-side-card">
                    <div class="card-header content-detail-side-header admin-detail-side-header"><span class="card-title">운영 정보</span></div>
                    <div class="card-body content-detail-side-body admin-detail-side-body">
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">등록일시</span>
                            <strong id="contentCreatedValue">-</strong>
                        </div>
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">수정일시</span>
                            <strong id="contentUpdatedValue">-</strong>
                        </div>
                        <div class="content-detail-side-item admin-detail-side-item">
                            <span class="content-detail-side-label admin-detail-side-label">조회수</span>
                            <strong id="contentViewsValue">-</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/content-shared.js"></script>
<script src="/js/view/content-get.js"></script>
<script th:inline="javascript">
    window.initialContentDetail = {
        id: /*[[${id}]]*/ null,
        boardType: /*[[${boardType}]]*/ 'NOTICE'
    };
</script>
<script>document.addEventListener('DOMContentLoaded', () => ContentDetail.init());</script>
</body>
</html>
