<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<div layout:fragment="content">
    <main class="container mt-4">
        <h2 class="mb-4 fw-bold">게시물 관리</h2>

        <!-- 검색 폼 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form class="row g-3" id="searchForm">
                    <div class="col-md-3">
                        <select class="form-select" id="searchKeywordType">
                            <option selected>검색 조건</option>
                            <option value="T">제목</option>
                            <option value="C">내용</option>
                        </select>
                    </div>
                    <div class="col-md-7">
                        <input type="text" id="searchKeyword" name="searchKeyword" class="form-control" placeholder="검색어를 입력하세요">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" id="submit-btn" class="btn btn-primary w-100">검색</button>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" id="testBtn" class="btn btn-primary w-100">최근7일동안 많이 본 리스트 조회</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 새 글 등록 버튼 -->
        <div class="d-flex justify-content-end mb-3">
            <button id="newContentBtn" class="btn btn-success">
                <i class="bi bi-pencil-square me-1"></i> 새 글 등록
            </button>
        </div>

        <!-- 게시물 리스트 -->
        <div id="document-list">

        </div>

        <!-- 페이지네이션 -->
        <nav aria-label="Page navigation" class="d-flex justify-content-center mt-4" id="pagination-wrapper">

        </nav>
    </main>
</div>

<th:block layout:fragment="script">
    <script src="/js/view/content-list.js"></script>
    <script>
        ContentListJS.init();
    </script>
</th:block>

</html>
