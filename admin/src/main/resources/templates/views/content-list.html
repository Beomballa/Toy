<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘텐츠 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .hover-card { transition: transform 0.2s; cursor: pointer; }
        .hover-card:hover { transform: translateY(-5px); }

</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">콘텐츠 관리</h1>
        <button class="btn btn-primary" id="btnNewContent"><i class="fas fa-plus me-2"></i>새 콘텐츠 작성</button>

    <ul class="nav nav-tabs mb-4" id="contentTabs">
        <li class="nav-item"><a class="nav-link active" href="#" data-board-type="NOTICE">공지사항</a></li>
        <li class="nav-item"><a class="nav-link" href="#" data-board-type="STYLE">스타일 가이드</a></li>
        <li class="nav-item"><a class="nav-link" href="#" data-board-type="DISCUSS">커뮤니티</a></li>
        <li class="nav-item"><a class="nav-link" href="#" data-board-type="QNA">문의사항</a></li>
    </ul>

    <div class="row" id="contentGrid"></div>

    <nav aria-label="Page navigation" class="mt-4"><ul class="pagination justify-content-center" id="pagination"></ul></nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/content-list.js"></script>

</html>
