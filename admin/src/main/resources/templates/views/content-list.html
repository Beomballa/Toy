<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘텐츠 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="content-board-page">
    <div class="page-header content-board-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item active" id="contentBreadcrumb">콘텐츠 관리</li>
            </ol>
        </nav>
        <div class="page-title-wrapper content-board-titlebar">
            <div class="content-board-heading">
                <div class="content-board-eyebrow" id="contentBoardBadge">NOTICE</div>
                <h1 class="page-title" id="contentPageTitle">콘텐츠 관리</h1>
                <p class="content-board-description" id="contentBoardDescription">커뮤니티 게시판별 문서와 운영 콘텐츠를 관리합니다.</p>
            </div>
            <button class="btn btn-primary content-board-create-btn" id="btnNewContent"><i class="fas fa-plus me-2"></i><span id="contentCreateLabel">새 콘텐츠 작성</span></button>
        </div>
    </div>

    <div class="content-board-tabs" id="contentTabs">
        <a class="content-board-tab active" href="#" data-board-type="NOTICE">공지사항</a>
        <a class="content-board-tab" href="#" data-board-type="STYLE">스타일 피드</a>
        <a class="content-board-tab" href="#" data-board-type="DISCUSS">종목 토론방</a>
        <a class="content-board-tab" href="#" data-board-type="QNA">문의사항</a>
    </div>

    <div class="content-board-toolbar">
        <form id="contentSearchForm" class="content-board-search-form">
            <div class="content-board-search-field">
                <i class="fas fa-search"></i>
                <input type="text" id="contentSearchKeyword" class="form-control" placeholder="제목 또는 본문 검색">
            </div>
            <select id="contentStatusFilter" class="form-select select-auto-width">
                <option value="">전체 상태</option>
                <option value="DRAFT">임시저장</option>
                <option value="PUBLISHED">게시중</option>
            </select>
            <select id="contentPublicFilter" class="form-select select-auto-width">
                <option value="">전체 공개</option>
                <option value="Y">공개</option>
                <option value="N">비공개</option>
            </select>
            <div class="form-check d-flex align-items-center ms-2">
                <input class="form-check-input me-2" type="checkbox" id="contentPinnedOnly">
                <label class="form-check-label" for="contentPinnedOnly">고정글만</label>
            </div>
            <button type="submit" class="btn btn-light">검색</button>
            <button type="button" class="btn btn-outline-secondary" id="btnResetContentSearch">초기화</button>
        </form>
    </div>

    <div class="content-board-toolbar">
        <div class="d-flex flex-wrap align-items-center gap-2 w-100">
            <label class="small text-muted mb-0">선택 작업</label>
            <div class="form-check d-flex align-items-center ms-1">
                <input class="form-check-input me-2" type="checkbox" id="contentSelectAllOnPage">
                <label class="form-check-label" for="contentSelectAllOnPage">현재 페이지 전체 선택</label>
            </div>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSelectCurrentPage">현재 페이지 선택</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnDeselectCurrentPage">현재 페이지 해제</button>
            <select id="contentBulkStatus" class="form-select select-auto-width">
                <option value="">상태 유지</option>
                <option value="DRAFT">임시저장</option>
                <option value="PUBLISHED">게시중</option>
            </select>
            <select id="contentBulkPublicYn" class="form-select select-auto-width">
                <option value="">공개 유지</option>
                <option value="Y">공개</option>
                <option value="N">비공개</option>
            </select>
            <select id="contentBulkPinnedYn" class="form-select select-auto-width">
                <option value="">고정 유지</option>
                <option value="Y">고정</option>
                <option value="N">고정 해제</option>
            </select>
            <button type="button" class="btn btn-outline-primary" id="btnApplyBulkOperate">선택 적용</button>
            <button type="button" class="btn btn-outline-secondary" id="btnClearSelection">선택 해제</button>
            <span class="small text-muted ms-auto" id="contentSelectionMeta">선택된 게시글 0건</span>
        </div>
    </div>

    <div class="content-board-toolbar">
        <div class="small text-muted w-100" id="contentBulkResultMeta">아직 일괄 적용 결과가 없습니다.</div>
    </div>

    <div class="row g-4 content-board-grid" id="contentGrid">
        <div class="col-12 text-center py-5 text-muted">데이터를 불러오는 중입니다...</div>
    </div>

    <div class="d-flex justify-content-center mt-4">
        <nav aria-label="Page navigation"><ul class="pagination pagination-sm" id="pagination"></ul></nav>
    </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/content-shared.js"></script>
<script src="/js/view/content-list.js"></script>
<script th:inline="javascript">
    window.initialContentBoardType = /*[[${boardType}]]*/ 'NOTICE';
</script>
</body>
</html>
