<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영 현황 대시보드 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <h1 class="page-title mb-4">운영 현황 대시보드</h1>

    <div class="card border-0 shadow-sm mb-4" id="operationNoticeSection">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="fw-bold mb-0">운영 공지</h6>
            <div class="d-flex gap-2">
                <a href="/admin/settings/notices?visibilityStatus=LIVE" class="btn btn-sm btn-outline-secondary">노출중</a>
                <a href="/admin/settings/notices?isPinned=Y" class="btn btn-sm btn-outline-secondary">고정 공지</a>
                <a href="/admin/settings/notices" class="btn btn-sm btn-outline-secondary">전체보기</a>
            </div>
        </div>
        <div class="card-body" id="operationNoticeBody">
            <div class="text-muted small">운영 공지를 불러오는 중입니다...</div>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4" id="operationTaskSection">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="fw-bold mb-0">운영 작업</h6>
            <div class="d-flex gap-2">
                <a href="/admin/settings/tasks?status=TODO" class="btn btn-sm btn-outline-secondary">대기</a>
                <a href="/admin/settings/tasks?status=IN_PROGRESS" class="btn btn-sm btn-outline-secondary">진행중</a>
                <a href="/admin/settings/tasks" class="btn btn-sm btn-outline-secondary">전체보기</a>
            </div>
        </div>
        <div class="card-body" id="operationTaskBody">
            <div class="text-muted small">운영 작업을 불러오는 중입니다...</div>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4" id="taskWorkloadSection">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="fw-bold mb-0">담당자별 워크로드</h6>
            <a href="/admin/settings/tasks/workloads" class="btn btn-sm btn-outline-secondary">워크로드 보기</a>
        </div>
        <div class="card-body" id="taskWorkloadBody">
            <div class="text-muted small">담당자별 작업 현황을 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- 통계 카드 섹션 -->
    <div class="row g-4 mb-4">
        <div class="col-md-6 col-xl"><div class="card summary-card shadow-sm"><div class="card-body"><div class="text-muted small mb-2">오늘의 주문</div><div class="stat-value" id="todayOrderCount">0</div><button type="button" class="btn btn-link btn-sm p-0 summary-card-link" id="summaryTodayOrders">주문 보기</button></div></div></div>
        <div class="col-md-6 col-xl"><div class="card summary-card shadow-sm"><div class="card-body"><div class="text-muted small mb-2">오늘의 매출</div><div class="stat-value" id="todayTotalAmount">0원</div><button type="button" class="btn btn-link btn-sm p-0 summary-card-link" id="summaryTodaySales">주문 보기</button></div></div></div>
        <div class="col-md-4 col-xl"><div class="card summary-card shadow-sm"><div class="card-body"><div class="text-muted small mb-2">배송 준비중</div><div class="stat-value" id="preparingCount">0</div><button type="button" class="btn btn-link btn-sm p-0 summary-card-link" id="summaryPreparingOrders">주문 보기</button></div></div></div>
        <div class="col-md-4 col-xl"><div class="card summary-card shadow-sm"><div class="card-body"><div class="text-muted small mb-2">배송중</div><div class="stat-value" id="shippingCount">0</div><button type="button" class="btn btn-link btn-sm p-0 summary-card-link" id="summaryShippingOrders">주문 보기</button></div></div></div>
        <div class="col-md-4 col-xl"><div class="card summary-card shadow-sm"><div class="card-body"><div class="text-muted small mb-2">취소 요청</div><div class="stat-value" id="cancelledCount">0</div><button type="button" class="btn btn-link btn-sm p-0 summary-card-link" id="summaryCancelledOrders">주문 보기</button></div></div></div>
    </div>

    <!-- 차트 섹션 -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h6 class="fw-bold mb-0">최근 7일 매출 추이</h6>
                </div>
                <div class="card-body">
                    <canvas id="salesChart" class="chart-canvas-sm"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <!-- 인기 상품 Top 5 (Bar Chart) -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3">
                    <h6 class="fw-bold mb-0">인기 상품 Top 5 (판매량)</h6>
                </div>
                <div class="card-body">
                    <canvas id="topProductsChart" class="chart-canvas-sm"></canvas>
                </div>
            </div>
        </div>
        <!-- 브랜드 매출 비중 (Doughnut Chart) -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3">
                    <h6 class="fw-bold mb-0">브랜드별 매출 비중</h6>
                </div>
                <div class="card-body">
                    <canvas id="topBrandsChart" class="chart-canvas-sm"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center"><h6 class="fw-bold mb-0">최근 주문 내역</h6><a href="/admin/orders/list" class="btn btn-sm btn-outline-primary">전체보기</a></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light"><tr><th class="ps-4">주문번호</th><th>주문자</th><th>금액</th><th>상태</th><th>일시</th><th class="text-end pe-4">관리</th></tr></thead>
                            <tbody id="recentOrderTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3"><h6 class="fw-bold mb-0 text-danger">재고 부족 상품 (10개 미만)</h6></div>
                <div class="card-body p-0"><div class="list-group list-group-flush" id="lowStockListBody"></div></div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/dashboard/dashboard-list.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => DashBoardListJS.init());</script>
</body>
</html>
