<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<th:block layout:fragment="css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* 카드 호버 효과 추가 */
        .hover-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .hover-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
        /* 내용 두 줄 이상 넘어가면 ... 처리 */
        .text-line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</th:block>

<div layout:fragment="content">
    <div class="main-container">
        <main id="main-content">
            <h1 class="mb-5 fw-bold">대시보드</h1>

            <div class="card mb-5 border-0 shadow-sm bg-light">
                <div class="card-body p-4 d-flex align-items-center justify-content-between">
                    <div>
                        <h5 class="card-title fw-bold">🚀 Botion AI를 사용해 보세요</h5>
                        <p class="card-text text-muted mb-0">사이드바에서 전체 페이지 Botion AI 사용해 보기</p>
                    </div>
                    <a href="#" class="btn btn-primary px-4">사용해 보기</a>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">🔥 이번 주 인기 게시물</h5>
                <small class="text-muted">최근 7일 조회수 기준</small>
            </div>

            <div id="popular-post-list" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mb-5">
            </div>

            <div id="no-data-message" class="text-center py-5 mb-5 d-none bg-white rounded shadow-sm border">
                <i class="bi bi-journal-x text-muted" style="font-size: 3rem;"></i>
                <p class="mt-3 text-muted">최근 7일간 조회된 게시물이 없습니다.<br>새로운 글을 작성해 보세요!</p>
                <a href="/content/list" class="btn btn-outline-primary btn-sm mt-2">글 쓰러 가기</a>
            </div>

            <h5 class="mb-3 fw-bold">📅 예정된 이벤트</h5>
            <div class="list-group shadow-sm">
                <a href="#" class="list-group-item list-group-item-action d-flex align-items-center p-3 border-0 border-bottom">
                    <span class="badge bg-primary rounded-pill me-3">오늘 22:00</span>
                    <span class="fw-semibold">카카오뱅크 - 프로젝트 마감</span>
                </a>
                <a href="#" class="list-group-item list-group-item-action d-flex align-items-center p-3 border-0">
                    <span class="badge bg-secondary rounded-pill me-3">내일 09:00</span>
                    <span>[휴가] 개인 연차</span>
                </a>
            </div>

        </main>
    </div>
</div>

<th:block layout:fragment="script">
    <script src="/js/view/dashboard/dashboard-list.js"></script>
    <script>
        window.addEventListener('pageshow', function(event) {
            DashBoardListJS.init();
        });
    </script>
    </script>
</th:block>

</html>
