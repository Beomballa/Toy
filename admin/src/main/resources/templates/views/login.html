<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 | Grade Stock</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin-login.css">
</head>
<body>
<main class="login-shell">
    <section class="login-brand" aria-label="Grade Stock 관리자 안내">
        <a href="/" class="login-logo" aria-label="Grade Stock 관리자 홈"><span>GS</span> Grade Stock</a>
        <div class="login-brand-copy">
            <p class="login-eyebrow">OPERATIONS CONSOLE</p>
            <h1>운영 흐름을<br>한곳에서 관리합니다.</h1>
            <p>상품, 주문, 콘텐츠와 서비스 상태를 안전하게 확인하세요.</p>
        </div>
        <p class="login-security-note">관리자 전용 시스템 · 모든 변경 이력은 기록됩니다.</p>
    </section>

    <section class="login-panel">
        <form class="login-form" action="/admin/login" method="post">
            <header>
                <p class="login-eyebrow">ADMIN ACCESS</p>
                <h2>관리자 로그인</h2>
                <p>등록된 운영 계정으로 로그인해 주세요.</p>
            </header>

            <div class="login-alert" role="alert" th:if="${loginError}" th:text="${loginError}"></div>

            <label for="loginId">아이디</label>
            <input id="loginId" name="loginId" type="text" autocomplete="username" maxlength="50"
                   th:value="${loginId}" required autofocus>

            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="100" required>

            <button type="submit">로그인</button>
            <p class="login-help">접근 권한이 없다면 최고 관리자에게 계정 상태를 확인해 주세요.</p>
        </form>
    </section>
</main>
</body>
</html>
