<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">회원 관리</h1>
    </div>

    <div class="card animate-in">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">No</th>
                            <th>이름 (닉네임)</th>
                            <th>이메일</th>
                            <th>관리자여부</th>
                            <th>가입일시</th>
                            <th class="text-end pe-4">상태</th>
                        </tr>
                    </thead>
                    <tbody id="memberListBody">
                        <tr><td colspan="6" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
    const MemberList = {
        init() {
            this.getList();
        },
        async getList() {
            try {
                const res = await fetch('/api/admin/members/list');
                const data = await res.json();
                this.renderList(data.content);
            } catch (err) {
                console.error('회원 목록 로드 실패:', err);
            }
        },
        renderList(items) {
            const tbody = document.getElementById('memberListBody');
            if (!items || items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">등록된 회원이 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = items.map(item => `
                <tr>
                    <td class="ps-4 text-muted small">${item.id}</td>
                    <td>
                        <div class="fw-bold text-dark">${item.name}</div>
                        <div class="text-muted small">${item.nickname || '-'}</div>
                    </td>
                    <td>${item.email}</td>
                    <td class="text-center">
                        <span class="badge ${item.masterYn === 'Y' ? 'badge-master' : 'badge-user'}">
                            ${item.masterYn === 'Y' ? '관리자' : '일반회원'}
                        </span>
                    </td>
                    <td class="text-muted small">${item.crtDtm || '-'}</td>
                    <td class="text-end pe-4">
                        <span class="badge ${item.delYn === 'N' ? 'badge-normal' : 'badge-deleted'}">
                            ${item.delYn === 'N' ? '정상' : '탈퇴'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }
    };
    document.addEventListener('DOMContentLoaded', () => MemberList.init());
</script>
</body>
</html>
               <td>${item.email}</td>
                    <td><span class="badge ${item.masterYn === 'Y' ? 'bg-primary' : 'bg-secondary'}">${item.masterYn === 'Y' ? '관리자' : '일반'}</span></td>
                    <td>${item.crtDtm || '-'}</td>
                    <td class="text-end pe-4">
                        <span class="badge ${item.delYn === 'N' ? 'bg-success' : 'bg-danger'}">${item.delYn === 'N' ? '정상' : '탈퇴'}</span>
                    </td>
                </tr>
            `).join('');
        }
    };
    document.addEventListener('DOMContentLoaded', () => MemberList.init());
</script>
</body>
</html>
