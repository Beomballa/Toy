<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content admin-page-shell admin-list-page">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item active">회원 관리</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <h1 class="page-title">회원 관리</h1>
            <button type="button" class="btn btn-outline-dark" id="btnExportMember"><i class="fas fa-file-csv me-2"></i>CSV 내보내기</button>
        </div>
        <div class="small text-muted mt-2 d-none" id="memberSourceContextNotice" data-source-context=""></div>
    </div>

    <section class="admin-summary-grid">
        <button type="button" class="admin-summary-card member-summary-card animate-in text-start" data-summary-filter="ALL">
            <div class="admin-summary-card__label">전체 회원</div>
            <div class="admin-summary-card__value" id="memberSummaryTotal">-</div>
            <div class="admin-summary-card__hint">현재 조건에 맞는 회원 수</div>
        </button>
        <button type="button" class="admin-summary-card member-summary-card animate-in text-start" data-summary-filter="MASTER">
            <div class="admin-summary-card__label">마스터 회원</div>
            <div class="admin-summary-card__value" id="memberSummaryMaster">-</div>
            <div class="admin-summary-card__hint">권한 회원 빠른 확인</div>
        </button>
        <button type="button" class="admin-summary-card member-summary-card animate-in text-start" data-summary-filter="DELETED">
            <div class="admin-summary-card__label">탈퇴 회원</div>
            <div class="admin-summary-card__value" id="memberSummaryDeleted">-</div>
            <div class="admin-summary-card__hint">복구 검토 대상 확인</div>
        </button>
        <button type="button" class="admin-summary-card member-summary-card animate-in text-start" data-summary-filter="TEMP_PASSWORD">
            <div class="admin-summary-card__label">임시 비밀번호</div>
            <div class="admin-summary-card__value" id="memberSummaryTempPassword">-</div>
            <div class="admin-summary-card__hint">초기 로그인 안내 필요</div>
        </button>
    </section>

    <div class="card animate-in admin-panel-card admin-filter-panel">
        <div class="card-body">
            <div class="admin-search-layout">
                <section class="admin-search-section">
                    <div class="admin-search-section__title">회원 검색</div>
                    <div class="admin-search-section__desc">이메일, 이름, 권한, 상태를 기준으로 회원을 빠르게 찾습니다.</div>
                    <div class="admin-filter-grid admin-search-grid">
                        <div class="admin-filter-field admin-filter-field--span-5">
                            <label class="admin-filter-label">검색</label>
                            <input type="text" id="memberKeyword" class="form-control" placeholder="이메일, 이름, 닉네임">
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-2">
                            <label class="admin-filter-label">권한</label>
                            <select id="memberMasterYn" class="form-select">
                                <option value="">전체</option>
                                <option value="Y">마스터</option>
                                <option value="N">일반</option>
                            </select>
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-2">
                            <label class="admin-filter-label">상태</label>
                            <select id="memberDelYn" class="form-select">
                                <option value="">전체</option>
                                <option value="N">정상</option>
                                <option value="Y">탈퇴</option>
                            </select>
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-2">
                            <label class="admin-filter-label">비밀번호</label>
                            <select id="memberInitYn" class="form-select">
                                <option value="">전체</option>
                                <option value="Y">임시 비밀번호</option>
                                <option value="N">정상</option>
                            </select>
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-1">
                            <label class="admin-filter-label">페이지</label>
                            <select id="memberPageSize" class="form-select">
                                <option value="20">20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>
                </section>
                <div class="task-filter-actions">
                    <div class="task-filter-actions__hint">회원 목록 필터는 URL 상태를 유지해 같은 검색 문맥으로 복원됩니다.</div>
                    <div class="admin-filter-actions">
                        <button type="button" class="btn btn-dark" id="btnSearchMember">조회</button>
                        <button type="button" class="btn btn-outline-secondary" id="btnResetMember">초기화</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in admin-panel-card admin-table-card">
        <div class="card-header bg-white py-3">
            <div class="admin-list-toolbar">
                <div class="admin-list-toolbar__title">
                    <div>
                        <span class="card-title h6 mb-0">회원 목록</span>
                        <div class="admin-list-toolbar__meta mt-1" id="memberFilterMeta">적용 필터를 계산하는 중입니다...</div>
                    </div>
                </div>
                <div class="admin-list-toolbar__meta" id="memberMetaText">데이터를 불러오는 중입니다...</div>
            </div>
        </div>
        <div class="card-body border-bottom py-2">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="small text-muted" id="memberPageMeta">페이지 메타를 계산하는 중입니다...</div>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4 table-col-80">No</th>
                            <th>이름 (닉네임)</th>
                            <th>이메일</th>
                            <th class="text-center">권한</th>
                            <th class="text-center">가입일시</th>
                            <th class="text-center">상세</th>
                            <th class="text-end pe-4">상태</th>
                        </tr>
                    </thead>
                    <tbody id="memberListBody">
                        <tr><td colspan="7" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="small text-muted" id="memberPaginationSummary">페이지 정보를 불러오는 중입니다...</div>
            <nav aria-label="회원 페이지네이션">
                <ul class="pagination pagination-sm mb-0" id="memberPagination"></ul>
            </nav>
        </div>
    </div>
</main>

<div class="modal fade" id="memberDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg member-detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">회원 상세</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="memberDetailBody">데이터를 불러오는 중입니다...</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-outline-primary" id="btnToggleMasterYn">권한 변경</button>
                <button type="button" class="btn btn-outline-danger" id="btnToggleMemberStatus">상태 변경</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/member-list.js"></script>
</body>
</html>
