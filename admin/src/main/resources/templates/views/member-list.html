<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item active">회원 관리</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <h1 class="page-title">회원 관리</h1>
            <button type="button" class="btn btn-outline-dark" id="btnExportMember"><i class="fas fa-file-csv me-2"></i>CSV 내보내기</button>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-6 col-xl-3">
            <button type="button" class="card w-100 border-0 shadow-sm text-start member-summary-card animate-in" data-summary-filter="ALL">
                <div class="card-body">
                    <div class="small text-muted mb-2">전체 회원</div>
                    <div class="h3 mb-1 fw-bold" id="memberSummaryTotal">-</div>
                    <div class="small text-muted">현재 조건에 맞는 회원 수</div>
                </div>
            </button>
        </div>
        <div class="col-md-6 col-xl-3">
            <button type="button" class="card w-100 border-0 shadow-sm text-start member-summary-card animate-in" data-summary-filter="MASTER">
                <div class="card-body">
                    <div class="small text-muted mb-2">마스터 회원</div>
                    <div class="h3 mb-1 fw-bold" id="memberSummaryMaster">-</div>
                    <div class="small text-muted">권한 회원 빠른 확인</div>
                </div>
            </button>
        </div>
        <div class="col-md-6 col-xl-3">
            <button type="button" class="card w-100 border-0 shadow-sm text-start member-summary-card animate-in" data-summary-filter="DELETED">
                <div class="card-body">
                    <div class="small text-muted mb-2">탈퇴 회원</div>
                    <div class="h3 mb-1 fw-bold" id="memberSummaryDeleted">-</div>
                    <div class="small text-muted">복구 검토 대상 확인</div>
                </div>
            </button>
        </div>
        <div class="col-md-6 col-xl-3">
            <button type="button" class="card w-100 border-0 shadow-sm text-start member-summary-card animate-in" data-summary-filter="TEMP_PASSWORD">
                <div class="card-body">
                    <div class="small text-muted mb-2">임시 비밀번호</div>
                    <div class="h3 mb-1 fw-bold" id="memberSummaryTempPassword">-</div>
                    <div class="small text-muted">초기 로그인 안내 필요</div>
                </div>
            </button>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label fw-bold">검색</label>
                    <input type="text" id="memberKeyword" class="form-control" placeholder="이메일, 이름, 닉네임">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">권한</label>
                    <select id="memberMasterYn" class="form-select">
                        <option value="">전체</option>
                        <option value="Y">마스터</option>
                        <option value="N">일반</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">상태</label>
                    <select id="memberDelYn" class="form-select">
                        <option value="">전체</option>
                        <option value="N">정상</option>
                        <option value="Y">탈퇴</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">비밀번호</label>
                    <select id="memberInitYn" class="form-select">
                        <option value="">전체</option>
                        <option value="Y">임시 비밀번호</option>
                        <option value="N">정상</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <label class="form-label fw-bold">페이지</label>
                    <select id="memberPageSize" class="form-select">
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <div class="col-md-12 d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="button" class="btn btn-dark" id="btnSearchMember">조회</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnResetMember">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <span class="card-title h6 mb-0">회원 목록</span>
            <div class="small text-muted" id="memberMetaText">데이터를 불러오는 중입니다...</div>
        </div>
        <div class="card-body border-bottom py-2">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="small text-muted" id="memberFilterMeta">적용 필터를 계산하는 중입니다...</div>
                <div class="small text-muted" id="memberPageMeta">페이지 메타를 계산하는 중입니다...</div>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4 table-col-80">No</th>
                            <th>이름 (닉네임)</th>
                            <th>이메일</th>
                            <th class="text-center">권한</th>
                            <th class="text-center">가입일시</th>
                            <th class="text-center">상세</th>
                            <th class="text-end pe-4">상태</th>
                        </tr>
                    </thead>
                    <tbody id="memberListBody">
                        <tr><td colspan="7" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="small text-muted" id="memberPaginationSummary">페이지 정보를 불러오는 중입니다...</div>
            <nav aria-label="회원 페이지네이션">
                <ul class="pagination pagination-sm mb-0" id="memberPagination"></ul>
            </nav>
        </div>
    </div>
</main>

<div class="modal fade" id="memberDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg member-detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">회원 상세</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="memberDetailBody">데이터를 불러오는 중입니다...</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-outline-primary" id="btnToggleMasterYn">권한 변경</button>
                <button type="button" class="btn btn-outline-danger" id="btnToggleMemberStatus">상태 변경</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/member-list.js"></script>
</body>
</html>
