<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영 공지 상세 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item"><a href="/admin/settings">시스템 설정</a></li>
                <li class="breadcrumb-item"><a id="noticeDetailBreadcrumbLink" th:href="${returnTo}">운영 공지</a></li>
                <li class="breadcrumb-item active">운영 공지 상세</li>
            </ol>
        </nav>
        <div class="page-title-wrapper d-flex justify-content-between align-items-start gap-3">
            <div>
                <h1 class="page-title">운영 공지 상세</h1>
                <div class="small text-muted" id="noticeDetailSummary">운영 공지 정보를 불러오는 중입니다.</div>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" id="btnNoticeDetailHistory" href="#">이력</a>
                <a class="btn btn-outline-secondary" id="btnNoticeDetailLog" href="#">활동 로그</a>
                <button type="button" class="btn btn-outline-secondary" id="btnBackToNoticeList">이전 화면</button>
            </div>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="card-title mb-0">운영 공지 정보</h6>
            <div class="small text-muted" id="noticeDetailMeta">데이터를 불러오는 중입니다...</div>
        </div>
        <div class="card-body">
            <div id="noticeDetailStateMeta"
                 data-detail-state="loading"
                 data-state-message="운영 공지 정보를 불러오는 중입니다."
                 data-notice-no=""
                 data-display-status=""></div>

            <div class="row g-4 mb-4">
                <div class="col-md-8">
                    <label class="form-label fw-bold text-muted small">공지 제목</label>
                    <div class="fs-4 fw-bold" id="noticeDetailTitle">-</div>
                </div>
                <div class="col-md-4 text-md-end">
                    <label class="form-label fw-bold text-muted small">노출 상태</label>
                    <div id="noticeDetailStatus">-</div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small">활성 여부</label>
                    <div id="noticeDetailIsActive">-</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small">고정 여부</label>
                    <div id="noticeDetailIsPinned">-</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small">시작 일시</label>
                    <div id="noticeDetailStartDtm">-</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small">종료 일시</label>
                    <div id="noticeDetailEndDtm">-</div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-muted small">공지 내용</label>
                <div class="border rounded-3 p-4 bg-light-subtle" id="noticeDetailContent">-</div>
            </div>

            <div>
                <label class="form-label fw-bold text-muted small">등록 일시</label>
                <div id="noticeDetailCrtDtm">-</div>
            </div>
        </div>
    </div>
</main>

<script th:inline="javascript">
    window.noticeDetailBootstrap = {
        noticeNo: [[${noticeNo}]],
        returnTo: [[${returnTo}]]
    };
</script>
<script src="/js/common.js"></script>
<script src="/js/view/notice-get.js"></script>
</body>
</html>
