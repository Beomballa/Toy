<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영 공지 상세 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content admin-page-shell admin-detail-page">
    <div class="page-header admin-detail-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item"><a href="/admin/settings">시스템 설정</a></li>
                <li class="breadcrumb-item"><a id="noticeDetailBreadcrumbLink" th:href="${returnTo}">운영 공지</a></li>
                <li class="breadcrumb-item active">운영 공지 상세</li>
            </ol>
        </nav>
        <div class="page-title-wrapper admin-detail-titlebar">
            <div class="admin-detail-heading">
                <h1 class="page-title">운영 공지 상세</h1>
                <div class="small text-muted" id="noticeDetailSummary">운영 공지 정보를 불러오는 중입니다.</div>
                <div class="small text-muted mt-2 d-none" id="noticeDetailSourceContextNotice" data-source-context=""></div>
            </div>
            <div class="admin-detail-actions">
                <button type="button" class="btn btn-primary" id="btnNoticeDetailEdit">수정</button>
                <button type="button" class="btn btn-outline-dark" id="btnNoticeDetailToggleActive">상태 변경</button>
                <button type="button" class="btn btn-outline-danger" id="btnNoticeDetailDelete">삭제</button>
                <a class="btn btn-outline-secondary" id="btnNoticeDetailHistory" href="#">이력</a>
                <a class="btn btn-outline-secondary" id="btnNoticeDetailLog" href="#">활동 로그</a>
                <button type="button" class="btn btn-outline-secondary" id="btnBackToNoticeList">이전 화면</button>
            </div>
        </div>
    </div>

    <div class="card animate-in admin-detail-card">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="card-title mb-0">운영 공지 정보</h6>
            <div class="small text-muted" id="noticeDetailMeta">운영 공지 정보를 불러오는 중입니다...</div>
        </div>
        <div class="card-body">
            <div id="noticeDetailStateMeta"
                 data-detail-state="loading"
                 data-state-message="운영 공지 정보를 불러오는 중입니다."
                 data-notice-no=""
                 data-display-status=""
                 data-return-to=""
                 data-return-context=""
                 data-source-context=""
                 data-last-action=""
                 data-last-action-source=""
                 data-last-action-status=""
                 data-last-action-history-path=""
                 data-last-action-log-path=""></div>

            <div class="alert alert-success d-none mb-4" id="noticeDetailActionNotice" role="alert" data-visible="N" data-action="" data-status="">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div class="fw-semibold" id="noticeDetailActionNoticeText"></div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="d-flex gap-2" id="noticeDetailActionNoticeActions"></div>
                        <button type="button" class="btn-close" aria-label="알림 닫기" id="noticeDetailActionNoticeClose"></button>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-8">
                    <label class="form-label fw-bold text-muted small">공지 제목</label>
                    <div class="fs-4 fw-bold" id="noticeDetailTitle">-</div>
                </div>
                <div class="col-md-4 text-md-end">
                    <label class="form-label fw-bold text-muted small">노출 상태</label>
                    <div id="noticeDetailStatus">-</div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small">활성 여부</label>
                    <div id="noticeDetailIsActive">-</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small">고정 여부</label>
                    <div id="noticeDetailIsPinned">-</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small">시작 일시</label>
                    <div id="noticeDetailStartDtm">-</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-muted small">종료 일시</label>
                    <div id="noticeDetailEndDtm">-</div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-muted small">공지 내용</label>
                <div class="border rounded-3 p-4 bg-light-subtle" id="noticeDetailContent">-</div>
            </div>

            <div>
                <label class="form-label fw-bold text-muted small">등록 일시</label>
                <div id="noticeDetailCrtDtm">-</div>
            </div>
        </div>
    </div>

    <div class="card animate-in admin-detail-side-card">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <div>
                <h6 class="card-title mb-0">최근 이력</h6>
                <div class="small text-muted mt-1" id="noticeDetailHistoryMeta">최근 이력을 불러오는 중입니다.</div>
            </div>
            <a class="btn btn-sm btn-outline-secondary" id="btnNoticeDetailHistoryMore" href="#">전체 이력 보기</a>
        </div>
        <div class="card-body">
            <div id="noticeDetailHistoryStateMeta"
                 data-list-state="loading"
                 data-visible-count="0"
                 data-state-message="최근 이력을 불러오는 중입니다."></div>
            <div class="list-group list-group-flush" id="noticeDetailRecentHistoryList">
                <div class="product-loading-state py-4">
                    <div class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></div>
                    <strong>최근 이력을 불러오는 중입니다.</strong>
                    <p>공지 수정, 상태 변경, 삭제 이력을 정리하고 있습니다.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="noticeDetailEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">운영 공지 수정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="noticeDetailEditForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">공지 제목</label>
                        <input type="text" id="noticeDetailEditTitle" class="form-control" maxlength="200" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">공지 내용</label>
                        <textarea id="noticeDetailEditContent" class="form-control" rows="6" maxlength="5000" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">시작 일시</label>
                            <input type="datetime-local" id="noticeDetailEditStartDtm" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">종료 일시</label>
                            <input type="datetime-local" id="noticeDetailEditEndDtm" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">상태</label>
                            <select id="noticeDetailEditIsActive" class="form-select">
                                <option value="Y">활성</option>
                                <option value="N">비활성</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">고정 여부</label>
                            <select id="noticeDetailEditIsPinned" class="form-select">
                                <option value="N">일반</option>
                                <option value="Y">고정</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="btnNoticeDetailSave">저장</button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    window.noticeDetailBootstrap = {
        noticeNo: [[${noticeNo}]],
        returnTo: [[${returnTo}]],
        source: [[${param.source != null ? param.source[0] : ''}]]
    };
</script>
<script src="/js/common.js"></script>
<script src="/js/view/notice-get.js"></script>
</body>
</html>
