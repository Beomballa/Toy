<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영 공지 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item"><a href="/admin/settings">시스템 설정</a></li>
                <li class="breadcrumb-item active">운영 공지</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <h1 class="page-title">운영 공지</h1>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" id="btnNoticeHistory" href="/admin/settings/notices/history"><i class="fas fa-clock-rotate-left me-2"></i>이력 보기</a>
                <button type="button" class="btn btn-outline-dark" id="btnExportNoticeCsv"><i class="fas fa-download me-2"></i>CSV 내보내기</button>
                <button type="button" class="btn btn-primary" id="btnNewNotice"><i class="fas fa-plus me-2"></i>신규 공지 등록</button>
            </div>
        </div>
        <div class="small text-muted mt-2 d-none" id="noticeSourceContextNotice" data-source-context=""></div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="noticeStatTotalCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">전체 공지</div>
                    <div class="stat-value" id="noticeTotalCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="noticeStatLiveCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">노출중</div>
                    <div class="stat-value" id="noticeLiveCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="noticeStatScheduledCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">예약 공지</div>
                    <div class="stat-value" id="noticeScheduledCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="noticeStatPinnedCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">고정 공지</div>
                    <div class="stat-value" id="noticePinnedCount">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body py-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="small text-muted" id="noticeStatsContextText">카드 기준을 계산하는 중입니다...</div>
                <div class="small text-muted" id="noticeStatsNotice" data-stats-context="">카드 기준을 계산하는 중입니다...</div>
            </div>
        </div>
    </div>

    <div class="alert alert-success d-none mb-4" id="noticeListActionNotice" role="alert" data-visible="N" data-action="" data-status="">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="fw-semibold" id="noticeListActionNoticeText"></div>
            <div class="d-flex align-items-center gap-2">
                <div class="d-flex gap-2" id="noticeListActionNoticeActions"></div>
                <button type="button" class="btn-close" aria-label="알림 닫기" id="noticeListActionNoticeClose"></button>
            </div>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label fw-bold">제목/내용 검색</label>
                    <input type="text" id="noticeKeyword" class="form-control" placeholder="운영 공지 검색">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">상태</label>
                    <select id="noticeIsActiveFilter" class="form-select">
                        <option value="">전체</option>
                        <option value="Y">활성</option>
                        <option value="N">비활성</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">고정</label>
                    <select id="noticeIsPinnedFilter" class="form-select">
                        <option value="">전체</option>
                        <option value="Y">고정</option>
                        <option value="N">일반</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">노출 상태</label>
                    <select id="noticeVisibilityStatusFilter" class="form-select">
                        <option value="">전체</option>
                        <option value="LIVE">노출중</option>
                        <option value="SCHEDULED">예약</option>
                        <option value="ENDED">종료</option>
                        <option value="INACTIVE">비활성</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <label class="form-label fw-bold">크기</label>
                    <select id="noticePageSize" class="form-select">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="col-md-1 d-grid gap-2">
                    <button type="button" class="btn btn-dark" id="btnSearchNotice">조회</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnResetNotice">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <div class="small text-muted" id="noticeSelectionMeta">선택된 공지가 없습니다.</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">일괄 상태 변경</label>
                    <select id="bulkNoticeIsActive" class="form-select">
                        <option value="">변경 안 함</option>
                        <option value="Y">활성</option>
                        <option value="N">비활성</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">일괄 고정 변경</label>
                    <select id="bulkNoticeIsPinned" class="form-select">
                        <option value="">변경 안 함</option>
                        <option value="Y">고정</option>
                        <option value="N">일반</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid gap-2">
                    <button type="button" class="btn btn-outline-dark" id="btnApplyNoticeBulk">일괄 적용</button>
                    <button type="button" class="btn btn-outline-danger" id="btnBulkDeleteNotice">일괄 삭제</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnClearNoticeSelection">선택 해제</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="card-title mb-0">운영 공지 목록</h6>
            <div class="small text-muted" id="noticeMetaText">데이터를 불러오는 중입니다...</div>
        </div>
        <div class="card-body border-bottom py-2">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="small text-muted" id="noticeFilterMeta">적용 필터를 계산하는 중입니다...</div>
                <div class="small text-muted" id="noticeResultMeta">결과 메타를 계산하는 중입니다...</div>
                <div class="small text-muted" id="noticePageMeta">페이지 메타를 계산하는 중입니다...</div>
            </div>
            <div id="noticeListStateMeta"
                 data-list-state="loading"
                 data-state-message="운영 공지를 불러오는 중입니다..."
                 data-total-elements="0"
                 data-visible-count="0"
                 data-query-signature=""
                 data-page-info-label=""
                 data-source-context=""
                 data-last-action=""
                 data-last-action-source=""
                 data-last-action-status=""
                 data-last-action-notice-no=""
                 data-last-action-history-path=""
                 data-last-action-log-path=""></div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4 table-col-80">
                            <input type="checkbox" id="noticeSelectPage">
                        </th>
                        <th class="table-col-80">No</th>
                        <th>제목</th>
                        <th>노출 기간</th>
                        <th class="text-center table-col-100">고정</th>
                        <th class="text-center table-col-100">상태</th>
                        <th class="text-end pe-4 table-col-220">관리</th>
                    </tr>
                    </thead>
                    <tbody id="noticeListBody">
                    <tr><td colspan="7" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <nav aria-label="운영 공지 목록 페이지 이동">
                <ul class="pagination justify-content-center mb-0" id="noticePagination"></ul>
            </nav>
        </div>
    </div>
</main>

<div class="modal fade" id="noticeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="noticeModalTitle">운영 공지 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="noticeForm">
                    <input type="hidden" id="noticeNo">
                    <div class="mb-3">
                        <label class="form-label fw-bold">공지 제목</label>
                        <input type="text" id="noticeTitle" class="form-control" maxlength="200" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">공지 내용</label>
                        <textarea id="noticeContent" class="form-control" rows="6" maxlength="5000" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">시작 일시</label>
                            <input type="datetime-local" id="noticeStartDtm" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">종료 일시</label>
                            <input type="datetime-local" id="noticeEndDtm" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">상태</label>
                            <select id="noticeIsActive" class="form-select">
                                <option value="Y">활성</option>
                                <option value="N">비활성</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">고정 여부</label>
                            <select id="noticeIsPinned" class="form-select">
                                <option value="N">일반</option>
                                <option value="Y">고정</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="btnSaveNotice">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/notice-list.js"></script>
</body>
</html>
