<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 상세 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .order-id-display { font-family: 'Monaco', monospace; font-weight: 600; color: #2563eb; font-size: 1.25rem; }
        .item-row { border-bottom: 1px solid #f1f5f9; transition: background 0.2s; }
        .item-row:hover { background-color: #f8fafc; }
        .product-img { width: 64px; height: 64px; object-fit: contain; border-radius: 8px; border: 1px solid #e2e8f0; }
        .status-select { max-width: 200px; }
        .badge-ordered { background-color: #ebf5ff; color: #1e429f; }
        .badge-paid { background-color: #def7ec; color: #03543f; }
        .badge-preparing { background-color: #fef3c7; color: #92400e; }
        .badge-shipped { background-color: #fdf6b2; color: #723b13; }
        .badge-delivered { background-color: #e1effe; color: #1e429f; }
        .badge-cancelled { background-color: #fde8e8; color: #9b1c1c; }
    </style>
</head>
<body>

<div class="main-container">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <main id="main-content">
        <div class="page-header">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                    <li class="breadcrumb-item"><a href="/admin/orders/list">주문 관리</a></li>
                    <li class="breadcrumb-item active">주문 상세</li>
                </ol>
            </nav>
            <div class="page-title-wrapper">
                <div>
                    <h1 class="page-title">주문 상세 정보</h1>
                    <div class="mt-2 d-flex align-items-center gap-3">
                        <span id="orderNumDisplay" class="order-id-display">-</span>
                        <span id="orderStatusBadge" class="badge rounded-pill">-</span>
                    </div>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <select id="updateStatusSelect" class="form-select status-select">
                        <option value="ORDERED">주문완료</option>
                        <option value="PAID">결제완료</option>
                        <option value="PREPARING">배송준비</option>
                        <option value="SHIPPED">배송중</option>
                        <option value="DELIVERED">배송완료</option>
                        <option value="CANCELLED">주문취소</option>
                    </select>
                    <button type="button" class="btn btn-primary" id="btnUpdateStatus">상태 변경</button>
                    <button type="button" class="btn btn-secondary ms-2" onclick="location.href='/admin/orders/list'">
                        <i class="fas fa-list me-2"></i>목록으로
                    </button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4">
                <div class="card animate-in mb-4">
                    <div class="card-header"><span class="card-title">주문자 정보</span></div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label class="text-muted small d-block mb-1">성함</label>
                            <div id="buyerName" class="fw-bold fs-5">-</div>
                        </div>
                        <div>
                            <label class="text-muted small d-block mb-1">연락처</label>
                            <div id="buyerPhone" class="fw-bold fs-5">-</div>
                        </div>
                    </div>
                </div>
                <div class="card animate-in">
                    <div class="card-header"><span class="card-title">결제 요약</span></div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">주문 일시</span>
                            <span id="orderDt" class="fw-medium">-</span>
                        </div>
                        <hr class="my-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="h6 mb-0">총 결제 금액</span>
                            <span id="totalAmount" class="h4 mb-0 text-primary fw-bold">-</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card animate-in">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="card-title">주문 상품 목록</span>
                        <span id="itemCount" class="badge bg-secondary rounded-pill">0</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4" style="width: 100px;">이미지</th>
                                        <th>상품 정보</th>
                                        <th class="text-center">수량</th>
                                        <th class="text-end pe-4">금액</th>
                                    </tr>
                                </thead>
                                <tbody id="orderItemsTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/order-get.js"></script>
</body>
</html>
