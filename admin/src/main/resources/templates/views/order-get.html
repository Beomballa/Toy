<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 상세 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content detail-main">
    <div class="detail-scroll-content admin-detail-page">
    <div class="page-header admin-detail-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item"><a href="/admin/orders/list" id="orderListBreadcrumb">주문 관리</a></li>
                <li class="breadcrumb-item active">주문 상세</li>
            </ol>
        </nav>
        <div class="page-title-wrapper admin-detail-titlebar">
            <div class="admin-detail-heading">
                <div class="admin-detail-eyebrow" id="orderDetailBadge">ORDER</div>
                <h1 class="page-title" id="orderDetailTitle">주문 상세 정보</h1>
                <div class="admin-detail-submeta">
                    <span class="admin-detail-meta-chip" id="orderNumDisplay">-</span>
                    <span class="admin-detail-meta-chip" id="orderStatusBadge">-</span>
                    <span class="admin-detail-meta-chip" id="orderDtMeta">주문일시 -</span>
                </div>
            </div>
            <div class="admin-detail-actions">
                <button type="button" class="btn btn-outline-danger hidden-default" id="btnCancelOrder">주문 취소</button>
                <button type="button" class="btn btn-secondary" id="btnBackToOrderList">목록으로</button>
            </div>
        </div>
    </div>

    <div class="row admin-detail-layout">
        <div class="col-lg-4">
            <div class="card animate-in admin-detail-side-card">
                <div class="card-header admin-detail-side-header"><span class="card-title">주문자 정보</span></div>
                <div class="card-body admin-detail-side-body">
                    <div class="admin-detail-side-item">
                        <span class="admin-detail-side-label">성함</span>
                        <strong id="buyerName">-</strong>
                    </div>
                    <div class="admin-detail-side-item">
                        <span class="admin-detail-side-label">연락처</span>
                        <strong id="buyerPhone">-</strong>
                    </div>
                </div>
            </div>
            <div class="card animate-in admin-detail-side-card">
                <div class="card-header admin-detail-side-header"><span class="card-title">결제 요약</span></div>
                <div class="card-body admin-detail-side-body">
                    <div class="admin-detail-side-item">
                        <span class="admin-detail-side-label">주문 일시</span>
                        <strong id="orderDt">-</strong>
                    </div>
                    <div class="admin-detail-side-item">
                        <span class="admin-detail-side-label">총 결제 금액</span>
                        <strong id="totalAmount" class="text-primary">-</strong>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card animate-in admin-detail-card">
                <div class="card-header admin-detail-side-header d-flex justify-content-between align-items-center">
                    <span class="card-title">주문 상품 목록</span>
                    <span id="itemCount" class="badge bg-secondary rounded-pill">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th class="ps-4 table-col-100">이미지</th><th>상품 정보</th><th class="text-center">수량</th><th class="text-end pe-4">금액</th></tr>
                            </thead>
                            <tbody id="orderItemsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 배송 정보 입력 (결제완료 상태일 때 노출) -->
            <div class="card animate-in admin-detail-card hidden-default" id="deliveryInputCard">
                <div class="card-header admin-detail-side-header"><span class="card-title text-primary"><i class="fas fa-truck me-2"></i>배송 정보 등록</span></div>
                <div class="card-body admin-detail-body">
                    <form id="deliveryForm" class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label small fw-bold">택배사</label>
                            <select id="deliveryCompany" class="form-select">
                                <option value="">택배사 선택</option>
                                <option value="CJ대한통운">CJ대한통운</option>
                                <option value="한진택배">한진택배</option>
                                <option value="롯데택배">롯데택배</option>
                                <option value="우체국택배">우체국택배</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-bold">운송장 번호</label>
                            <input type="text" id="trackingNum" class="form-control" placeholder="숫자만 입력">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="button" class="btn btn-primary w-100" id="btnSaveDelivery">발송</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 배송 정보 표시 (이미 배송 중이거나 완료된 경우) -->
            <div class="card animate-in admin-detail-card hidden-default" id="deliveryInfoCard">
                <div class="card-header admin-detail-side-header d-flex justify-content-between align-items-center">
                    <span class="card-title text-primary"><i class="fas fa-truck-loading me-2"></i>배송 정보</span>
                    <button type="button" class="btn btn-sm btn-success hidden-default" id="btnCompleteDelivery">배송 완료 처리</button>
                </div>
                <div class="card-body admin-detail-body">
                    <div class="row">
                        <div class="col-6">
                            <label class="admin-detail-side-label d-block">택배사</label>
                            <div id="displayCompany" class="fw-bold fs-5">-</div>
                        </div>
                        <div class="col-6">
                            <label class="admin-detail-side-label d-block">운송장 번호</label>
                            <div id="displayTracking" class="fw-bold fs-5 text-primary">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/order-get.js"></script>
</body>
</html>
