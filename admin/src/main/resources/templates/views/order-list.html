<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<!-- 사이드바 (상품 관리와 동일한 방식) -->
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<!-- 메인 콘텐츠 영역 -->
<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item"><a href="#">Sales</a></li>
                <li class="breadcrumb-item active">Order Management</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <h1 class="page-title">주문 관리</h1>
            <div class="btn-group">
                <button class="btn btn-secondary" type="button">
                    <i class="fas fa-download me-2"></i>엑셀 다운로드
                </button>
            </div>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body">
            <div class="filter-row">
                <div class="filter-item">
                    <div class="filter-label">주문 상태</div>
                    <select class="form-select" id="orderStatus">
                        <option value="">전체 상태</option>
                        <option value="ORDERED">주문완료</option>
                        <option value="PAID">결제완료</option>
                        <option value="PREPARING">배송준비</option>
                        <option value="SHIPPED">배송중</option>
                        <option value="DELIVERED">배송완료</option>
                        <option value="CANCELLED">주문취소</option>
                    </select>
                </div>
                <div class="filter-item">
                    <div class="filter-label">기간 설정</div>
                    <div class="input-group">
                        <input type="date" class="form-control" id="startDate">
                        <span class="input-group-text">~</span>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                </div>
                <div class="filter-item filter-item-search">
                    <div class="filter-label">주문 검색</div>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchKeyword" class="form-control" placeholder="주문번호, 주문자명 검색">
                    </div>
                </div>
                <div class="filter-item flex-fixed-auto">
                    <button class="btn btn-primary w-100" type="button" id="btnFilter">
                        <i class="fas fa-filter me-2"></i>필터 적용
                    </button>
                </div>
                <div class="filter-item flex-fixed-auto">
                    <button class="btn btn-outline-secondary w-100" type="button" id="btnResetFilter">
                        <i class="fas fa-rotate-left me-2"></i>초기화
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header d-flex justify-content-between align-items-center bg-white py-3">
            <div>
                <span class="card-title h6 mb-0">주문 내역</span>
                <span class="card-subtitle text-muted ms-2" id="totalElementsCount">전체 0건</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <label for="pageSize" class="small text-muted mb-0">페이지 크기</label>
                <select class="form-select form-select-sm select-auto-width" id="pageSize">
                    <option value="10">10개</option>
                    <option value="20">20개</option>
                    <option value="50">50개</option>
                </select>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">주문번호</th>
                        <th>주문일시</th>
                        <th>주문자 정보</th>
                        <th>상품 정보</th>
                        <th>결제금액</th>
                        <th>상태</th>
                        <th class="text-end pe-4">관리</th>
                    </tr>
                    </thead>
                    <tbody id="orderListTableBody">
                    <tr><td colspan="6" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white border-top-0 py-3">
            <div class="row align-items-center">
                <div class="col-sm-6 text-center text-sm-start mb-3 mb-sm-0">
                    <span class="small text-muted" id="pageInfoText"></span>
                </div>
                <div class="col-sm-6">
                    <nav aria-label="Page navigation">
                        <ul class="pagination pagination-sm justify-content-center justify-content-sm-end mb-0" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/order-list.js"></script>
</body>
</html>
