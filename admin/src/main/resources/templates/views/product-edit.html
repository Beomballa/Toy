<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 수정 | Grade-Stock Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<!-- 메인 콘텐츠 -->
<main class="main-content admin-page-shell detail-main admin-form-page">
  <div class="detail-scroll-content admin-form-page">
  <!-- 페이지 헤더 -->
  <div class="page-header">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin">Home</a></li>
        <li class="breadcrumb-item"><a href="/admin/products">상품 관리</a></li>
        <li class="breadcrumb-item active">상품 수정</li>
      </ol>
    </nav>
    <div class="page-title-wrapper">
      <h1 class="page-title">상품 수정</h1>
      <div>
        <button type="button" class="btn btn-secondary me-2" id="btnCancel">
          <i class="fas fa-arrow-left me-2"></i>취소
        </button>
        <button type="button" class="btn btn-primary" id="btnSubmit">
          <i class="fas fa-check me-2"></i>수정 완료
        </button>
      </div>
    </div>
  </div>

  <!-- 수정 폼 -->
  <form id="productEditForm">
    <input type="hidden" id="productNo">

    <div class="row">
      <!-- 왼쪽: 기본 정보 -->
      <div class="col-lg-8">
        <div class="card animate-in admin-form-card">
          <div class="card-header">
            <span class="card-title">기본 정보</span>
          </div>
          <div class="card-body admin-card-form-grid">
            <div class="row g-3 admin-card-form-row">
              <!-- 카테고리 -->
              <div class="col-md-6 admin-card-form-field">
                <label class="form-label">카테고리 <span class="text-danger">*</span></label>
                <select class="form-select" id="categoryNo" name="categoryNo" required>
                  <option value="">카테고리를 선택하세요</option>
                </select>
              </div>

              <!-- 브랜드 -->
              <div class="col-md-6 admin-card-form-field">
                <label class="form-label">브랜드 <span class="text-danger">*</span></label>
                <select class="form-select" id="brandNo" name="brandNo" required>
                  <option value="">브랜드를 선택하세요</option>
                </select>
              </div>

              <!-- 상품명 -->
              <div class="col-12 admin-card-form-field">
                <label class="form-label">상품명 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nameKo" name="nameKo" required>
              </div>

              <!-- 모델번호 -->
              <div class="col-md-6 admin-card-form-field">
                <label class="form-label">모델번호</label>
                <input type="text" class="form-control" id="modelNum" name="modelNum">
              </div>

              <!-- 발매가 -->
              <div class="col-md-6 admin-card-form-field">
                <label class="form-label">발매가 (원) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="releasePrice" name="releasePrice" min="0" required>
              </div>

              <!-- 발매일 -->
              <div class="col-md-6 admin-card-form-field">
                <label class="form-label">발매일</label>
                <input type="date" class="form-control" id="releaseDt" name="releaseDt">
              </div>

              <!-- 상태 -->
              <div class="col-md-6 admin-card-form-field">
                <label class="form-label">상태 <span class="text-danger">*</span></label>
                <select class="form-select" id="status" name="status" required>
                  <option value="ACTIVE">판매중</option>
                  <option value="HIDDEN">숨김</option>
                  <option value="SOLD_OUT">품절</option>
                </select>
              </div>

              <!-- 썸네일 URL -->
              <div class="col-12 admin-card-form-field">
                <label class="form-label">썸네일 이미지 URL</label>
                <input type="text" class="form-control" id="thumbnailUrl" name="thumbnailUrl">
                <small class="text-muted">이미지 URL을 입력하거나 비워두세요</small>
              </div>
            </div>
          </div>
        </div>

        <!-- 등록 정보 (읽기 전용) -->
        <div class="card animate-in admin-form-card">
          <div class="card-header">
            <span class="card-title">등록 정보</span>
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6 admin-card-form-field">
                <label class="small text-muted">등록 관리자</label>
                <div id="crtAdminNo" class="fw-bold mb-3">-</div>
              </div>
              <div class="col-md-6 admin-card-form-field">
                <label class="small text-muted">등록일시</label>
                <div id="crtDtm" class="fw-bold mb-3">-</div>
              </div>
              <div class="col-md-6 admin-card-form-field">
                <label class="small text-muted">최종 수정일시</label>
                <div id="uptDtm" class="fw-bold">-</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 오른쪽: 미리보기 -->
      <div class="col-lg-4">
        <div class="card animate-in preview-sticky admin-form-card">
          <div class="card-header">
            <span class="card-title">미리보기</span>
          </div>
          <div class="card-body">
            <!-- 썸네일 미리보기 -->
            <div class="text-center mb-4">
              <img id="previewImage"
                   src="https://via.placeholder.com/300x300?text=No+Image"
                   class="img-fluid rounded preview-image-contain preview-image-contain-300"
                   alt="상품 미리보기">
            </div>

            <!-- 상품 정보 미리보기 -->
            <div class="preview-info">
              <div class="mb-3">
                <label class="small text-muted">카테고리</label>
                <div id="previewCategory" class="fw-bold">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">브랜드</label>
                <div id="previewBrand" class="fw-bold">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">상품명</label>
                <div id="previewName" class="fw-bold">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">모델번호</label>
                <div id="previewModel" class="text-secondary">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">발매가</label>
                <div id="previewPrice" class="fw-bold text-primary fs-5">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">상태</label>
                <div id="previewStatus">-</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="/js/view/product-update.js?v=20260730-1"></script>

<script>
    $(document).ready(() => {
        ProductEdit.init();
    });
</script>
</body>
</html>
