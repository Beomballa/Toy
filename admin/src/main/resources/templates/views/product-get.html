<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세 | Grade-Stock Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<div class="main-container">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main id="main-content" class="detail-main">
        <div class="detail-scroll-content product-detail-page admin-detail-page">
        <div class="page-header product-detail-header admin-detail-header">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                    <li class="breadcrumb-item"><a href="/admin/products" id="productListBreadcrumb">상품 관리</a></li>
                    <li class="breadcrumb-item active">상품 상세</li>
                </ol>
            </nav>
            <div class="page-title-wrapper product-detail-titlebar admin-detail-titlebar">
                <div class="product-detail-heading admin-detail-heading">
                    <div class="product-detail-eyebrow admin-detail-eyebrow" id="productCategoryChip">Product Detail</div>
                    <h1 class="page-title" id="productTitle">상품 상세</h1>
                    <div class="small text-muted mt-2 d-none" id="productDetailSourceContextNotice" data-source-context=""></div>
                    <div class="product-detail-submeta admin-detail-submeta">
                        <span class="product-detail-meta-chip admin-detail-meta-chip" id="brandChip">브랜드 -</span>
                        <span class="product-detail-meta-chip admin-detail-meta-chip" id="modelChip">모델 -</span>
                        <span class="product-detail-meta-chip admin-detail-meta-chip" id="releaseMetaChip">발매일 -</span>
                        <span id="statusBadge"></span>
                    </div>
                </div>
                <div class="product-detail-actions admin-detail-actions">
                    <span class="visually-hidden" id="productReturnContextMeta"
                          data-return-to=""
                          data-return-label=""
                          data-return-button-label=""></span>
                    <button type="button" class="btn btn-secondary" id="btnBackToProductList">
                        <i class="fas fa-list me-2"></i>목록
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnSearchImage">
                        <i class="fas fa-image me-2"></i>실제 이미지 보기
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnCloneProduct">
                        <i class="fas fa-copy me-2"></i>복제
                    </button>
                    <button type="button" class="btn btn-primary" id="btnEdit">
                        <i class="fas fa-edit me-2"></i>수정
                    </button>
                    <button type="button" class="btn btn-danger" id="btnDelete">
                        <i class="fas fa-trash me-2"></i>삭제
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4 product-detail-layout admin-detail-layout">
            <div class="col-lg-5">
                <div class="card animate-in product-hero-card">
                    <div class="card-body product-hero-body">
                        <div class="product-image-stage">
                            <img id="productImage" src="https://via.placeholder.com/500x500?text=Loading..."
                                 class="img-fluid rounded preview-image-contain preview-image-contain-500 product-hero-image">
                        </div>
                        <div class="product-hero-caption">
                            <span class="product-hero-caption-label">대표 이미지</span>
                            <a id="thumbnailUrlLink" href="#" target="_blank" class="product-hero-link hidden-default">
                                <i class="fas fa-external-link-alt me-1"></i>이미지 새창 열기
                            </a>
                        </div>
                    </div>
                </div>
                <div class="card animate-in product-option-card">
                    <div class="card-header product-section-header">
                        <span class="card-title">상품 옵션</span>
                        <span class="product-section-count" id="optionCount">0</span>
                    </div>
                    <div class="card-body">
                        <div id="optionList" class="product-option-list"></div>
                    </div>
                </div>
                <div class="card animate-in product-option-card mt-4">
                    <div class="card-header product-section-header">
                        <span class="card-title">변경 이력</span>
                        <span class="product-section-count" id="historyCount">0</span>
                    </div>
                    <div class="card-body">
                        <div id="productHistoryList" class="product-option-list">
                            <p class="text-muted small mb-0">변경 이력을 불러오는 중입니다.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card animate-in product-summary-card">
                    <div class="card-body">
                        <div class="product-summary-top">
                            <div>
                                <div class="product-summary-label">판매 정보</div>
                                <div id="releasePrice" class="product-summary-price">-</div>
                            </div>
                            <div class="product-summary-side">
                                <div class="product-summary-side-label">총 재고</div>
                                <div class="product-summary-side-value" id="totalStockValue">0 개</div>
                            </div>
                        </div>
                        <div class="product-summary-grid">
                            <div class="product-summary-item">
                                <span class="product-summary-item-label">상품번호</span>
                                <strong id="productNo">-</strong>
                            </div>
                            <div class="product-summary-item">
                                <span class="product-summary-item-label">브랜드</span>
                                <strong id="brandName">-</strong>
                            </div>
                            <div class="product-summary-item">
                                <span class="product-summary-item-label">카테고리</span>
                                <strong id="categoryName">-</strong>
                            </div>
                            <div class="product-summary-item">
                                <span class="product-summary-item-label">발매일</span>
                                <strong id="releaseDt">-</strong>
                            </div>
                        </div>
                        <div class="product-summary-name-block">
                            <div class="product-summary-name-label">상품명</div>
                            <div id="nameKo" class="product-summary-name">-</div>
                        </div>
                    </div>
                </div>
                <div class="row g-4">
                    <div class="col-12">
                        <div class="card animate-in">
                            <div class="card-header product-section-header"><span class="card-title">기본 정보</span></div>
                            <div class="card-body">
                                <div class="product-info-grid">
                                    <div class="product-info-row">
                                        <span class="product-info-label">모델번호</span>
                                        <span class="product-info-value"><span id="modelNum" class="badge badge-model">-</span></span>
                                    </div>
                                    <div class="product-info-row">
                                        <span class="product-info-label">상태</span>
                                        <span class="product-info-value" id="statusTextValue">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="card animate-in">
                            <div class="card-header product-section-header"><span class="card-title">프론트 노출 정보</span></div>
                            <div class="card-body">
                                <div class="product-info-grid">
                                    <div class="product-info-row">
                                        <span class="product-info-label">헤드라인</span>
                                        <span class="product-info-value" id="frontDisplayHeadline">-</span>
                                    </div>
                                    <div class="product-info-row">
                                        <span class="product-info-label">무드 키워드</span>
                                        <span class="product-info-value" id="frontDisplayMood">-</span>
                                    </div>
                                    <div class="product-info-row">
                                        <span class="product-info-label">Featured</span>
                                        <span class="product-info-value" id="frontDisplayFeatured">-</span>
                                    </div>
                                    <div class="product-info-row">
                                        <span class="product-info-label">노출 순서</span>
                                        <span class="product-info-value" id="frontDisplayRank">-</span>
                                    </div>
                                    <div class="product-info-row">
                                        <span class="product-info-label">설명 문구</span>
                                        <span class="product-info-value" id="frontDisplayDescription">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                <div class="card animate-in">
                    <div class="card-header product-section-header"><span class="card-title">관리 정보</span></div>
                    <div class="card-body">
                        <div class="product-info-grid">
                            <div class="product-info-row">
                                <span class="product-info-label">등록일시</span>
                                <span class="product-info-value" id="crtDtm">-</span>
                            </div>
                            <div class="product-info-row">
                                <span class="product-info-label">수정일시</span>
                                <span class="product-info-value" id="uptDtm">-</span>
                            </div>
                            <div class="product-info-row">
                                <span class="product-info-label">썸네일 URL</span>
                                <span class="product-info-value">
                                    <a id="thumbnailUrlLinkInline" href="#" target="_blank" class="product-inline-link hidden-default">
                                        <i class="fas fa-external-link-alt me-1"></i>이미지 새창 열기
                                    </a>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/product-get.js"></script>
<script th:inline="javascript">
    const productDetailData = /*[[${product}]]*/ null;
    document.addEventListener('DOMContentLoaded', () => ProductDetail.init(productDetailData));
</script>
</body>
</html>
