<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세 | Grade-Stock Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="/css/product.css">
  <style>
      .badge-active {
          background-color: #dcfce7;
          color: #166534;
      }

      .badge-model {
          background-color: #f3f4f6;
          color: #374151;
          font-weight: 500;
      }

      .stat-label {
          font-size: 0.85rem;
          margin-bottom: 5px;
      }
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon">GS</div>
    <div class="sidebar-brand-text">Grade Stock</div>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Main Menu</div>
    <a class="nav-link" href="/admin/dashboard">
      <i class="fas fa-chart-line"></i> 대시보드
    </a>
    <a class="nav-link active" href="/admin/products">
      <i class="fas fa-box"></i> 상품 관리
    </a>
    <a class="nav-link" href="/admin/market">
      <i class="fas fa-chart-bar"></i> 실시간 시세
    </a>
    <a class="nav-link" href="/admin/orders">
      <i class="fas fa-shopping-cart"></i> 주문 관리
    </a>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Community</div>
    <a class="nav-link" href="/admin/discuss">
      <i class="fas fa-comments"></i> 종목 토론방
    </a>
    <a class="nav-link" href="/admin/style">
      <i class="fas fa-camera"></i> 스타일 피드
    </a>
    <a class="nav-link" href="/admin/members">
      <i class="fas fa-users"></i> 회원 관리
    </a>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">System</div>
    <a class="nav-link" href="/admin/settings">
      <i class="fas fa-cog"></i> 시스템 설정
    </a>
  </div>
</nav>

<main class="main-content">
  <div class="page-header">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin">Home</a></li>
        <li class="breadcrumb-item"><a href="/admin/products">상품 관리</a></li>
        <li class="breadcrumb-item active">상품 상세</li>
      </ol>
    </nav>
    <div class="page-title-wrapper">
      <div>
        <h1 class="page-title" id="productTitle">상품 상세</h1>
        <div id="statusBadge" class="mt-2"></div>
      </div>
      <div>
        <button type="button" class="btn btn-secondary me-2" onclick="window.location.href='/admin/products'">
          <i class="fas fa-list me-2"></i>목록
        </button>
        <button type="button" class="btn btn-primary me-2" id="btnEdit">
          <i class="fas fa-edit me-2"></i>수정
        </button>
        <button type="button" class="btn btn-danger" id="btnDelete">
          <i class="fas fa-trash me-2"></i>삭제
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-5">
      <div class="card animate-in mb-4">
        <div class="card-body p-4 text-center">
          <img id="productImage" src="https://via.placeholder.com/500x500?text=Loading..."
               class="img-fluid rounded" style="max-height: 500px; object-fit: contain; border: 1px solid #E5E7EB;">
        </div>
      </div>

      <div class="card animate-in">
        <div class="card-header d-flex justify-content-between">
          <span class="card-title">상품 옵션 (사이즈)</span>
          <span class="badge bg-primary rounded-pill" id="optionCount">0</span>
        </div>
        <div class="card-body">
          <div id="optionList" class="d-flex flex-wrap gap-2">
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card animate-in mb-4">
        <div class="card-header"><span class="card-title">기본 정보</span></div>
        <div class="card-body">
          <table class="table table-borderless">
            <colgroup>
              <col style="width: 150px;">
              <col>
            </colgroup>
            <tbody>
            <tr>
              <th class="text-muted">상품번호</th>
              <td id="productNo" class="fw-bold">-</td>
            </tr>
            <tr>
              <th class="text-muted">카테고리</th>
              <td id="categoryName">-</td>
            </tr>
            <tr>
              <th class="text-muted">브랜드</th>
              <td id="brandName" class="fw-bold">-</td>
            </tr>
            <tr>
              <th class="text-muted">상품명</th>
              <td id="nameKo" class="fw-bold fs-5">-</td>
            </tr>
            <tr>
              <th class="text-muted">모델번호</th>
              <td><span id="modelNum" class="badge badge-model">-</span></td>
            </tr>
            <tr>
              <th class="text-muted">발매가</th>
              <td id="releasePrice" class="fw-bold text-primary fs-4">-</td>
            </tr>
            <tr>
              <th class="text-muted">발매일</th>
              <td id="releaseDt">-</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card animate-in mb-4">
        <div class="card-header"><span class="card-title">관리 정보</span></div>
        <div class="card-body">
          <table class="table table-borderless">
            <colgroup>
              <col style="width: 150px;">
              <col>
            </colgroup>
            <tbody>
            <tr>
              <th class="text-muted">등록일시</th>
              <td id="crtDtm">-</td>
            </tr>
            <tr>
              <th class="text-muted">수정일시</th>
              <td id="uptDtm">-</td>
            </tr>
            <tr>
              <th class="text-muted">썸네일 URL</th>
              <td><a id="thumbnailUrlLink" href="#" target="_blank" class="text-primary text-decoration-none small">
                <i class="fas fa-external-link-alt me-1"></i>이미지 새창 열기</a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card animate-in">
        <div class="card-header"><span class="card-title">실시간 현황</span></div>
        <div class="card-body py-4">
          <div class="row text-center">
            <div class="col-6 border-end">
              <div class="stat-label text-muted">총 재고량</div>
              <div class="stat-value fs-4 fw-bold" id="totalStockValue">0</div>
            </div>
            <div class="col-6">
              <div class="stat-label text-muted">상태</div>
              <div class="stat-value fs-4 fw-bold text-success" id="statusTextValue">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="/js/view/product-get.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        ProductDetail.init();
    });
</script>
</body>
</html>
