<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 변경 이력 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content admin-page-shell admin-list-page">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item"><a href="/admin/products">상품 관리</a></li>
                <li class="breadcrumb-item active">변경 이력</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <div>
                <h1 class="page-title">상품 변경 이력</h1>
                <div class="small text-muted mt-2 d-none" id="productHistorySourceContextNotice" data-source-context=""></div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-outline-dark" id="btnExportProductHistoryCsv"><i class="fas fa-download me-2"></i>CSV 내보내기</button>
            </div>
        </div>
    </div>

    <div class="card animate-in admin-panel-card admin-filter-panel">
        <div class="card-body">
            <div class="admin-search-layout">
                <section class="admin-search-section">
                    <div class="admin-search-section__title">기본 이력 검색</div>
                    <div class="admin-search-section__desc">상품 번호, 작업 유형, 작업자 기준으로 변경 이력 범위를 먼저 줄입니다.</div>
                    <div class="admin-filter-grid admin-search-grid">
                        <div class="admin-filter-field admin-filter-field--span-2">
                            <label class="admin-filter-label">상품 번호</label>
                            <input type="number" id="historyProductNo" class="form-control" min="1">
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-2">
                            <label class="admin-filter-label">작업 유형</label>
                            <select id="historyActionType" class="form-select">
                                <option value="">전체</option>
                                <option value="CREATED">등록</option>
                                <option value="UPDATED">수정</option>
                                <option value="DELETED">삭제</option>
                            </select>
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-4">
                            <label class="admin-filter-label">요약 검색</label>
                            <input type="text" id="historyKeyword" class="form-control" placeholder="변경 항목, 요약 검색">
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-4">
                            <label class="admin-filter-label">작업자 검색</label>
                            <input type="text" id="historyActorKeyword" class="form-control" placeholder="관리자 이름">
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-2">
                            <label class="admin-filter-label">작업자 번호</label>
                            <input type="number" id="historyActorNo" class="form-control" min="1" placeholder="예: 12">
                        </div>
                    </div>
                </section>

                <section class="admin-search-section">
                    <div class="admin-search-section__title">기간 및 정렬</div>
                    <div class="admin-search-section__desc">조회 기간과 정렬 방향을 함께 조절해서 원하는 이력 묶음을 빠르게 찾습니다.</div>
                    <div class="admin-filter-grid admin-search-grid">
                        <div class="admin-filter-field admin-filter-field--span-3">
                            <label class="admin-filter-label">시작일</label>
                            <input type="date" id="historyStartDate" class="form-control">
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-3">
                            <label class="admin-filter-label">종료일</label>
                            <input type="date" id="historyEndDate" class="form-control">
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-3">
                            <label class="admin-filter-label">빠른 기간</label>
                            <div class="admin-chip-row">
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-product-history-date-preset="today">오늘</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-product-history-date-preset="7days">최근 7일</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-product-history-date-preset="30days">최근 30일</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-product-history-date-preset="clear">기간 초기화</button>
                            </div>
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-3">
                            <label class="admin-filter-label">정렬</label>
                            <select id="historyOrderType" class="form-select">
                                <option value="latest">최신순</option>
                                <option value="oldest">오래된순</option>
                            </select>
                        </div>
                        <div class="admin-filter-field admin-filter-field--span-3">
                            <label class="admin-filter-label">작업 유형 바로가기</label>
                            <div class="admin-chip-row">
                                <button type="button" class="btn btn-sm btn-outline-dark product-history-quick-filter active" data-action-type="">전체</button>
                                <button type="button" class="btn btn-sm btn-outline-dark product-history-quick-filter" data-action-type="CREATED">등록</button>
                                <button type="button" class="btn btn-sm btn-outline-dark product-history-quick-filter" data-action-type="UPDATED">수정</button>
                                <button type="button" class="btn btn-sm btn-outline-dark product-history-quick-filter" data-action-type="DELETED">삭제</button>
                            </div>
                        </div>
                    </div>
                </section>
                <div class="task-filter-actions">
                    <div class="task-filter-actions__hint">상품 이력도 URL 상태를 유지해서 상세 이동 후 같은 필터 문맥으로 다시 돌아옵니다.</div>
                    <div class="admin-filter-actions">
                        <button type="button" class="btn btn-dark" id="btnSearchHistory">조회</button>
                        <button type="button" class="btn btn-outline-secondary" id="btnResetProductHistory">초기화</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in admin-panel-card admin-table-card">
        <div class="card-header bg-white py-3">
            <div class="admin-list-toolbar">
                <div class="admin-list-toolbar__title">
                    <h6 class="card-title mb-0">변경 이력 목록</h6>
                    <span class="admin-list-toolbar__meta" id="historyFilterMeta">적용 필터 0개</span>
                </div>
                <div class="admin-list-toolbar__actions">
                    <label class="small text-muted d-flex align-items-center gap-2 mb-0 flex-wrap">
                        <span>페이지 크기</span>
                        <select id="historyPageSize" class="form-select form-select-sm product-master-inline-select">
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </label>
                    <span class="admin-list-toolbar__meta" id="historyMetaText">데이터를 불러오는 중입니다...</span>
                </div>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">이력 번호</th>
                        <th>상품 번호</th>
                        <th>작업 유형</th>
                        <th>요약</th>
                        <th>작업자</th>
                        <th>재고/옵션</th>
                        <th class="text-end pe-4">작업 일시</th>
                    </tr>
                    </thead>
                    <tbody id="productHistoryBody">
                    <tr><td colspan="7" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <div class="small text-muted text-center mb-2" id="historyPageMeta">페이지 메타 계산 중</div>
            <ul class="pagination pagination-sm justify-content-center mb-0" id="historyPagination"></ul>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/product-history.js"></script>
</body>
</html>
