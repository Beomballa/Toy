<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 마스터 관리 | Grade-Stock Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/common.css">

</head>
<body>

<!-- 공통 사이드바 사용 -->
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">

  <div class="page-header">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Commerce</a></li>
        <li class="breadcrumb-item active">Product Master</li>
      </ol>
    </nav>
    <div class="page-title-wrapper">
      <h1 class="page-title">상품 마스터 관리</h1>
      <div class="btn-group">
        <button class="btn btn-secondary" id="btnExportProducts" type="button">
          <i class="fas fa-download me-2"></i>엑셀 다운로드
        </button>
        <button class="btn btn-primary" id="new-product" type="button">
          <i class="fas fa-plus me-2"></i>새 상품 등록
        </button>
      </div>
    </div>
  </div>

  <div class="stats-grid animate-in">
    <div class="stat-card" id="statTotalCard" role="button" tabindex="0">
      <div class="stat-icon blue"><i class="fas fa-box"></i></div>
      <div class="stat-label">전체 상품</div>
      <div class="stat-value" id="stat-total-count">0</div>
    </div>
    <div class="stat-card" id="statActiveCard" role="button" tabindex="0">
      <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
      <div class="stat-label">활성 상품</div>
      <div class="stat-value" id="stat-active-count">0</div>
    </div>
    <div class="stat-card" id="statLowStockCard" role="button" tabindex="0">
      <div class="stat-icon orange"><i class="fas fa-exclamation-triangle"></i></div>
      <div class="stat-label">품절 임박</div>
      <div class="stat-meta" id="stat-low-stock-threshold">100개 미만</div>
      <div class="stat-value" id="stat-low-stock">0</div>
    </div>
    <div class="stat-card" id="statTodayCard" role="button" tabindex="0">
      <div class="stat-icon purple"><i class="fas fa-fire"></i></div>
      <div class="stat-label">오늘 등록</div>
      <div class="stat-value" id="stat-today-count">0</div>
    </div>
  </div>

  <div class="product-filter-summary animate-in" id="productFilterSummary" aria-live="polite">
    <div class="product-filter-summary-copy">
      <span class="product-filter-summary-label">현재 필터</span>
      <strong id="productFilterSummaryTitle">전체 상품</strong>
      <span class="product-filter-summary-desc" id="productFilterSummaryDescription">모든 상품을 보고 있습니다.</span>
      <span class="product-filter-summary-meta" id="productFilterSummaryMeta">정렬: 최신순</span>
    </div>
    <div class="product-filter-summary-chips" id="productFilterSummaryChips"></div>
  </div>

  <!-- ✅ 필터 영역: flex 기반으로 넓게 배치 -->
  <div class="card animate-in mb-4">
    <div class="card-body">
      <div class="filter-row">

        <div class="filter-item">
          <div class="filter-label">브랜드</div>
          <select class="form-select" id="brandNo" name="brandNo">
            <option value="">전체 브랜드</option>
          </select>
        </div>

        <div class="filter-item">
          <div class="filter-label">카테고리</div>
          <select class="form-select" id="categoryNo" name="categoryNo">
            <option value="">전체 카테고리</option>
          </select>
        </div>

        <div class="filter-item">
          <div class="filter-label">상태</div>
          <select class="form-select" id="statusFilter">
            <option value="">전체 상태</option>
            <option value="ACTIVE">판매중 (ACTIVE)</option>
            <option value="HIDDEN">숨김 (HIDDEN)</option>
            <option value="SOLD_OUT">품절 (SOLD_OUT)</option>
          </select>
        </div>

        <div class="filter-item flex-fixed-auto">
          <div class="filter-label">재고 조건</div>
          <div class="d-flex gap-2 align-items-center mt-2">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="lowStockOnly">
              <label class="form-check-label" for="lowStockOnly">품절 임박만 보기</label>
            </div>
            <select class="form-select form-select-sm" id="lowStockThreshold" style="width: auto;">
              <option value="10">10개 미만</option>
              <option value="30">30개 미만</option>
              <option value="50">50개 미만</option>
              <option value="100" selected>100개 미만</option>
            </select>
          </div>
        </div>

        <div class="filter-item flex-fixed-auto">
          <div class="filter-label">등록 조건</div>
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" id="createdTodayOnly">
            <label class="form-check-label" for="createdTodayOnly">오늘 등록만 보기</label>
          </div>
        </div>

        <div class="filter-item filter-item-search">
          <div class="filter-label">상품 검색</div>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="searchKeyword" class="form-control"
                   placeholder="상품명 또는 모델번호 입력 후 엔터">
            <button class="btn btn-outline-secondary" type="button" id="btnSearchProducts">검색</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="card animate-in">
    <div class="card-header d-flex justify-content-between align-items-center bg-white py-3">
      <div>
        <span class="card-title h6 mb-0">상품 목록</span>
        <span class="card-subtitle text-muted ms-2" id="totalElementsCount">전체 0개</span>
      </div>
      <div class="dropdown">
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" id="pageSize" style="width: auto;">
            <option value="10">10개</option>
            <option value="20">20개</option>
            <option value="50">50개</option>
          </select>
          <button class="btn btn-sm btn-outline-secondary" type="button" id="btnResetFilter">초기화</button>
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="orderType" data-bs-toggle="dropdown" data-current-value="r">
            최신순
          </button>
        </div>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#" data-value="r">최신순</a></li>
          <li><a class="dropdown-item" href="#" data-value="p">발매가순</a></li>
          <li><a class="dropdown-item" href="#" data-value="c">재고순</a></li>
        </ul>
      </div>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
          <tr>
            <th class="ps-4">상품 정보</th>
            <th>모델번호</th>
            <th>브랜드</th>
            <th>발매가</th>
            <th>총 재고</th>
            <th>상태</th>
            <th>등록일</th>
            <th class="text-end pe-4">관리</th>
          </tr>
          </thead>
          <tbody id="productListTableBody">
          <tr>
            <td colspan="8" class="text-center py-5">
              <div class="spinner-border spinner-border-sm text-primary me-2"></div>
              데이터를 불러오는 중입니다...
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card-footer bg-white border-top-0 py-3">
      <div class="row align-items-center">
        <div class="col-sm-6 text-center text-sm-start mb-3 mb-sm-0">
          <span class="small text-muted" id="pageInfoText">Showing 0 to 0 of 0 entries</span>
        </div>
        <div class="col-sm-6">
          <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm justify-content-center justify-content-sm-end mb-0" id="pagination"></ul>
          </nav>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/product-list.js"></script>

<script th:inline="javascript">
    const brands = /*[[${brands}]]*/ [];
    const categories = /*[[${categories}]]*/ [];
    document.addEventListener('DOMContentLoaded', () => ProductList.init(brands, categories));
</script>

</body>
</html>
