<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 등록 | Grade-Stock Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<!-- 공통 사이드바 사용 -->
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<!-- 메인 콘텐츠 -->
<main class="main-content admin-page-shell detail-main admin-form-page">
  <div class="detail-scroll-content admin-form-page">
  <!-- 페이지 헤더 -->
  <div class="page-header admin-detail-header">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin">Home</a></li>
        <li class="breadcrumb-item"><a href="/admin/products" id="productListBreadcrumb">상품 관리</a></li>
        <li class="breadcrumb-item active">상품 등록</li>
      </ol>
    </nav>
    <div class="page-title-wrapper admin-detail-titlebar">
      <div class="admin-detail-heading">
        <h1 class="page-title">새 상품 등록</h1>
        <span class="visually-hidden" id="productReturnContextMeta"
              data-return-to=""
              data-return-label=""
              data-return-button-label=""></span>
      </div>
      <div class="admin-form-actions">
        <button type="button" class="btn btn-secondary" id="btnBackToProductList">
          <i class="fas fa-arrow-left me-2"></i>취소
        </button>
        <button type="button" class="btn btn-primary" id="btnSubmit">
          <i class="fas fa-check me-2"></i>등록하기
        </button>
      </div>
    </div>
  </div>

  <!-- 등록 폼 -->
  <form id="productCreateForm">
    <div class="admin-form-layout">
      <!-- 왼쪽: 기본 정보 -->
      <div class="admin-form-main">
        <div class="card animate-in admin-form-card">
          <div class="card-header">
            <span class="card-title">기본 정보</span>
          </div>
          <div class="card-body">
            <div class="row g-3">
              <!-- 카테고리 -->
              <div class="col-md-6">
                <label class="form-label">카테고리 <span class="text-danger">*</span></label>
                <select class="form-select" id="categoryNo" name="categoryNo" required>
                  <option value="">카테고리를 선택하세요</option>
                  <!-- JavaScript로 동적 로드 -->
                </select>
              </div>

              <!-- 브랜드 -->
              <div class="col-md-6">
                <label class="form-label">브랜드 <span class="text-danger">*</span></label>
                <select class="form-select" id="brandNo" name="brandNo" required>
                  <option value="">브랜드를 선택하세요</option>
                  <!-- JavaScript로 동적 로드 -->
                </select>
              </div>

              <!-- 상품명 -->
              <div class="col-12">
                <label class="form-label">상품명 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nameKo" name="nameKo"
                       placeholder="예: Nike Air Force 1 '07 Low White" required>
                <small class="text-muted">브랜드명과 상품 설명을 포함하여 입력해주세요</small>
              </div>

              <!-- 모델번호 -->
              <div class="col-md-6">
                <label class="form-label">모델번호</label>
                <input type="text" class="form-control" id="modelNum" name="modelNum"
                       placeholder="예: CW2288-111">
                <small class="text-muted">선택사항</small>
              </div>

              <!-- 발매가 -->
              <div class="col-md-6">
                <label class="form-label">발매가 (원) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="releasePrice" name="releasePrice"
                       placeholder="139000" min="0" required>
              </div>

              <!-- 발매일 -->
              <div class="col-md-6">
                <label class="form-label">발매일</label>
                <input type="date" class="form-control" id="releaseDt" name="releaseDt">
              </div>

              <!-- 썸네일 URL -->
              <div class="col-12">
                <label class="form-label">썸네일 이미지 URL</label>
                <input type="text" class="form-control" id="thumbnailUrl" name="thumbnailUrl"
                       placeholder="https://example.com/image.jpg">
                <small class="text-muted">이미지 URL을 입력하거나 비워두세요</small>
              </div>
            </div>
          </div>
        </div>

        <!-- 상품 옵션 -->
        <div class="card animate-in admin-form-card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="card-title">상품 옵션 (사이즈)</span>
            <button type="button" class="btn btn-sm btn-primary" id="btnAddOption">
              <i class="fas fa-plus me-1"></i>옵션 추가
            </button>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>옵션명 (사이즈 등)</th>
                    <th class="table-col-150">추가 금액</th>
                    <th class="table-col-150">재고 수량</th>
                    <th class="table-col-80">관리</th>
                  </tr>
                </thead>
                <tbody id="optionTableBody">
                  <tr>
                    <td colspan="4" class="text-center py-4 text-muted">
                      <i class="fas fa-info-circle me-2"></i>상품 사이즈 옵션을 추가해주세요.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 오른쪽: 미리보기 -->
      <div class="admin-form-side">
        <div class="card animate-in admin-form-card preview-sticky">
          <div class="card-header">
            <span class="card-title">미리보기</span>
          </div>
          <div class="card-body">
            <!-- 썸네일 미리보기 -->
            <div class="text-center mb-4">
              <img id="previewImage"
                   src="https://via.placeholder.com/300x300?text=No+Image"
                   class="img-fluid rounded preview-image-contain preview-image-contain-300"
                   alt="상품 미리보기">
            </div>

            <!-- 상품 정보 미리보기 -->
            <div class="preview-info">
              <div class="mb-3">
                <label class="small text-muted">카테고리</label>
                <div id="previewCategory" class="fw-bold">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">브랜드</label>
                <div id="previewBrand" class="fw-bold">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">상품명</label>
                <div id="previewName" class="fw-bold">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">모델번호</label>
                <div id="previewModel" class="text-secondary">-</div>
              </div>
              <div class="mb-3">
                <label class="small text-muted">발매가</label>
                <div id="previewPrice" class="fw-bold text-primary fs-5">-</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card animate-in admin-form-card">
          <div class="card-header">
            <span class="card-title">프론트 노출 정보</span>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">헤드라인 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="frontDisplayHeadline" maxlength="120"
                     placeholder="예: Grey precision">
            </div>
            <div class="mb-3">
              <label class="form-label">설명 문구 <span class="text-danger">*</span></label>
              <textarea class="form-control" id="frontDisplayDescription" rows="4" maxlength="1000"
                        placeholder="프론트 카탈로그에 노출할 설명 문구"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">무드 키워드 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="frontDisplayMood" maxlength="120"
                     placeholder="예: Grey precision">
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Featured 노출</label>
                <select class="form-select" id="frontDisplayFeatured">
                  <option value="false">일반 노출</option>
                  <option value="true">Featured</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">노출 순서</label>
                <input type="number" class="form-control" id="frontDisplayRank" min="1" max="999" value="999">
                <div class="form-text" id="frontDisplayRankGuide">Featured 순번 정보를 불러오는 중입니다.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
  </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>

<!-- 상품 등록 스크립트 (바닐라 JS) -->
<script src="/js/view/product-set.js"></script>

<!-- Thymeleaf에서 데이터 전달 & 초기화 -->
<script th:inline="javascript">
    const brands = /*[[${brands}]]*/ [];
    const categories = /*[[${categories}]]*/ [];

    // DOM 로드 완료 후 초기화
    document.addEventListener('DOMContentLoaded', function() {
        ProductCreate.init(brands, categories);
    });
</script>
</body>
</html>
