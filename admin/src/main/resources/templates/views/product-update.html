<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 수정 | Grade-Stock Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<div class="main-container">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <main id="main-content">
        <div class="page-header">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                    <li class="breadcrumb-item"><a href="/admin/products">상품 관리</a></li>
                    <li class="breadcrumb-item active">상품 수정</li>
                </ol>
            </nav>
            <div class="page-title-wrapper"><h1 class="page-title">상품 정보 수정</h1></div>
        </div>

        <form id="productUpdateForm">
            <input type="hidden" id="productNo" th:value="${#strings.isEmpty(param.no) ? '' : param.no}">
            <div class="row">
                <div class="col-lg-8">
                    <div class="card animate-in mb-4">
                        <div class="card-header"><span class="card-title">기본 정보</span></div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">카테고리</label>
                                    <select class="form-select" id="categoryNo" name="categoryNo" required>
                                        <option th:each="cat : ${categories}" th:value="${cat.categoryNo}" th:text="${cat.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">브랜드</label>
                                    <select class="form-select" id="brandNo" name="brandNo" required>
                                        <option th:each="brand : ${brands}" th:value="${brand.brandNo}" th:text="${brand.nameKo}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">상품명 (한글)</label>
                                <input type="text" class="form-control" id="nameKo" name="nameKo" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">모델 번호</label>
                                    <input type="text" class="form-control" id="modelNum" name="modelNum">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">판매 상태</label>
                                    <select class="form-select" id="productStatus" name="status">
                                        <option value="ACTIVE">판매중 (ACTIVE)</option>
                                        <option value="HIDDEN">숨김 (HIDDEN)</option>
                                        <option value="SOLD_OUT">품절 (SOLD_OUT)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">발매가</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="releasePrice" name="releasePrice">
                                        <span class="input-group-text">원</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">발매일</label>
                                    <input type="date" class="form-control" id="releaseDt" name="releaseDt">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card animate-in">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span class="card-title">상품 옵션 수정</span>
                            <button type="button" class="btn btn-sm btn-outline-primary" id="btnAddOption"><i class="fas fa-plus me-1"></i>옵션 추가</button>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table align-middle">
                                    <thead>
                                        <tr>
                                            <th>옵션명 (사이즈 등)</th>
                                            <th style="width: 150px;">추가 금액</th>
                                            <th style="width: 150px;">재고 수량</th>
                                            <th style="width: 80px;">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody id="optionTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card animate-in mb-4">
                        <div class="card-header"><span class="card-title">미리보기</span></div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">이미지 URL</label>
                                <input type="text" class="form-control" id="thumbnailUrl" name="thumbnailUrl">
                            </div>
                            <div id="imagePreview" class="bg-light rounded d-flex align-items-center justify-content-center border" style="height: 300px;">
                                <img src="" id="previewImage" class="img-fluid d-none" style="max-height: 100%;" alt="상품 미리보기">
                                <span id="previewText" class="text-muted">이미지 미리보기</span>
                            </div>
                            <div class="preview-info mt-4">
                                <div class="mb-3">
                                    <label class="small text-muted">카테고리</label>
                                    <div id="previewCategory" class="fw-bold">-</div>
                                </div>
                                <div class="mb-3">
                                    <label class="small text-muted">브랜드</label>
                                    <div id="previewBrand" class="fw-bold">-</div>
                                </div>
                                <div class="mb-3">
                                    <label class="small text-muted">상품명</label>
                                    <div id="previewName" class="fw-bold">-</div>
                                </div>
                                <div class="mb-3">
                                    <label class="small text-muted">모델 번호</label>
                                    <div id="previewModel" class="text-secondary">-</div>
                                </div>
                                <div class="mb-3">
                                    <label class="small text-muted">발매가</label>
                                    <div id="previewPrice" class="fw-bold text-primary fs-5">-</div>
                                </div>
                                <div>
                                    <label class="small text-muted">판매 상태</label>
                                    <div id="previewStatus" class="fw-bold">ACTIVE</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-primary btn-lg py-3" id="btnUpdate"><i class="fas fa-check me-2"></i>수정 완료</button>
                        <button type="button" class="btn btn-outline-secondary py-2" onclick="history.back()">취소</button>
                    </div>
                </div>
            </div>
        </form>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/product-update.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => ProductUpdate.init());</script>
</body>
</html>
