<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 후기 관리 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css?v=20260812.1">
</head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<main class="main-content admin-page-shell admin-list-page">
    <div class="page-header">
        <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/admin">Home</a></li><li class="breadcrumb-item active">상품 후기 관리</li></ol></nav>
        <div class="page-title-wrapper"><h1 class="page-title">상품 후기 관리</h1></div>
        <p class="text-muted small mb-0">배송 완료 주문의 후기만 관리하며, 삭제 대신 노출 상태를 변경해 복구할 수 있습니다.</p>
    </div>
    <section class="card admin-panel-card admin-filter-panel mb-4">
        <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="admin-chip-row" id="reviewStatusFilters" role="group" aria-label="후기 노출 상태 필터">
                <button class="btn btn-sm btn-dark" type="button" data-status="ALL">전체</button>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-status="VISIBLE">노출</button>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-status="HIDDEN">숨김</button>
            </div>
            <span class="small text-muted" id="reviewListMeta">후기 목록을 불러오는 중입니다.</span>
        </div>
    </section>
    <section class="card admin-panel-card admin-table-card">
        <div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th class="ps-4">상품</th><th>작성자</th><th>평점</th><th>후기</th><th>작성일</th><th>상태</th><th class="text-end pe-4">관리</th></tr></thead>
            <tbody id="reviewListBody"><tr><td colspan="7" class="text-center py-5 text-muted">후기 목록을 불러오는 중입니다.</td></tr></tbody>
        </table></div></div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center"><span class="small text-muted" id="reviewPageMeta"></span><button class="btn btn-sm btn-outline-secondary" id="reviewMoreButton" type="button" hidden>후기 더보기</button></div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/review-list.js?v=20260812.1"></script>
</body>
</html>
