<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영 작업 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item"><a href="/admin/settings">시스템 설정</a></li>
                <li class="breadcrumb-item active">운영 작업</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <h1 class="page-title">운영 작업</h1>
            <button type="button" class="btn btn-primary" id="btnNewTask"><i class="fas fa-plus me-2"></i>신규 작업 등록</button>
        </div>
        <div class="small text-muted mt-2 d-none" id="taskSourceContextNotice" data-source-context=""></div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="taskStatTotalCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">전체 작업</div>
                    <div class="stat-value" id="taskTotalCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="taskStatTodoCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">대기</div>
                    <div class="stat-value" id="taskTodoCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="taskStatProgressCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">진행중</div>
                    <div class="stat-value" id="taskInProgressCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="taskStatOverdueCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">기한 초과</div>
                    <div class="stat-value" id="taskOverdueCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm stat-card-clickable" id="taskStatUnassignedCard">
                <div class="card-body">
                    <div class="text-muted small mb-2">미지정</div>
                    <div class="stat-value" id="taskUnassignedCount">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body py-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="small text-muted" id="taskStatsContextText">카드 기준을 계산하는 중입니다...</div>
                <div class="small text-muted" id="taskStatsNotice" data-stats-context="">카드 기준을 계산하는 중입니다...</div>
            </div>
        </div>
    </div>

    <div class="alert alert-success d-none mb-4" id="taskListActionNotice" role="status"
         data-visible="N" data-action="" data-status="">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div id="taskListActionNoticeText">마지막 조치 결과를 불러오는 중입니다.</div>
            <div class="d-flex align-items-center gap-2">
                <div class="d-flex gap-2" id="taskListActionNoticeActions"></div>
                <button type="button" class="btn-close" aria-label="닫기" id="taskListActionNoticeClose"></button>
            </div>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold">제목/설명 검색</label>
                    <input type="text" id="taskKeyword" class="form-control" placeholder="운영 작업 검색">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">상태</label>
                    <select id="taskStatusFilter" class="form-select">
                        <option value="">전체</option>
                        <option value="TODO">대기</option>
                        <option value="IN_PROGRESS">진행중</option>
                        <option value="DONE">완료</option>
                        <option value="HOLD">보류</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">우선순위</label>
                    <select id="taskPriorityFilter" class="form-select">
                        <option value="">전체</option>
                        <option value="HIGH">높음</option>
                        <option value="MEDIUM">보통</option>
                        <option value="LOW">낮음</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">담당자</label>
                    <select id="taskAssigneeFilter" class="form-select">
                        <option value="">전체</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <label class="form-label fw-bold">고정</label>
                    <select id="taskPinnedFilter" class="form-select">
                        <option value="">전체</option>
                        <option value="Y">고정만</option>
                        <option value="N">일반만</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <div class="d-flex flex-column gap-2 mt-4 pt-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="taskOverdueOnly">
                            <label class="form-check-label" for="taskOverdueOnly">기한 초과만</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="taskUnassignedOnly">
                            <label class="form-check-label" for="taskUnassignedOnly">미지정만</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-1">
                    <label class="form-label fw-bold">크기</label>
                    <select id="taskPageSize" class="form-select">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="col-md-1 d-grid gap-2">
                    <button type="button" class="btn btn-dark" id="btnSearchTask">조회</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnResetTask">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <div class="small text-muted" id="taskSelectionMeta">선택된 작업이 없습니다.</div>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">일괄 상태 변경</label>
                    <select id="bulkTaskStatus" class="form-select">
                        <option value="">변경 안 함</option>
                        <option value="TODO">대기</option>
                        <option value="IN_PROGRESS">진행중</option>
                        <option value="DONE">완료</option>
                        <option value="HOLD">보류</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">일괄 우선순위 변경</label>
                    <select id="bulkTaskPriority" class="form-select">
                        <option value="">변경 안 함</option>
                        <option value="HIGH">높음</option>
                        <option value="MEDIUM">보통</option>
                        <option value="LOW">낮음</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">일괄 담당자 변경</label>
                    <select id="bulkTaskAssignee" class="form-select">
                        <option value="">변경 안 함</option>
                        <option value="__UNASSIGN__">담당 해제</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <label class="form-label fw-bold">일괄 고정 변경</label>
                    <select id="bulkTaskPinned" class="form-select">
                        <option value="">변경 안 함</option>
                        <option value="Y">고정</option>
                        <option value="N">일반</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid gap-2">
                    <button type="button" class="btn btn-outline-dark" id="btnApplyTaskBulk">일괄 적용</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnClearTaskSelection">선택 해제</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="card-title mb-0">운영 작업 목록</h6>
            <div class="small text-muted" id="taskMetaText">데이터를 불러오는 중입니다...</div>
        </div>
        <div class="card-body border-bottom py-2">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="small text-muted" id="taskFilterMeta">적용 필터를 계산하는 중입니다...</div>
                <div class="small text-muted" id="taskResultMeta">결과 메타를 계산하는 중입니다...</div>
                <div class="small text-muted" id="taskPageMeta">페이지 메타를 계산하는 중입니다...</div>
            </div>
            <div id="taskListStateMeta"
                 data-list-state="loading"
                 data-state-message="운영 작업을 불러오는 중입니다..."
                 data-total-elements="0"
                 data-visible-count="0"
                 data-query-signature=""
                 data-page-info-label=""
                 data-active-stat-filter=""
                 data-highlight-task-no=""
                 data-source-context=""
                 data-last-action=""
                 data-last-action-source=""
                 data-last-action-status=""
                 data-last-action-task-no=""
                 data-last-action-history-path=""
                 data-last-action-log-path=""></div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4 table-col-80">
                            <input type="checkbox" id="taskSelectPage">
                        </th>
                        <th class="ps-4 table-col-80">No</th>
                        <th>작업</th>
                        <th class="table-col-120">상태</th>
                        <th class="table-col-100">우선순위</th>
                        <th class="table-col-140">담당자</th>
                        <th class="table-col-140">기한</th>
                        <th class="text-end pe-4 table-col-260">관리</th>
                    </tr>
                    </thead>
                    <tbody id="taskListBody">
                    <tr><td colspan="8" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <nav aria-label="운영 작업 목록 페이지 이동">
                <ul class="pagination justify-content-center mb-0" id="taskPagination"></ul>
            </nav>
        </div>
    </div>
</main>

<div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="taskModalTitle">운영 작업 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="taskForm">
                    <input type="hidden" id="taskNo">
                    <div class="mb-3">
                        <label class="form-label fw-bold">작업 제목</label>
                        <input type="text" id="taskTitle" class="form-control" maxlength="200" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">작업 설명</label>
                        <textarea id="taskDescription" class="form-control" rows="5" maxlength="5000"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">상태</label>
                            <select id="taskStatus" class="form-select">
                                <option value="TODO">대기</option>
                                <option value="IN_PROGRESS">진행중</option>
                                <option value="DONE">완료</option>
                                <option value="HOLD">보류</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">우선순위</label>
                            <select id="taskPriority" class="form-select">
                                <option value="HIGH">높음</option>
                                <option value="MEDIUM">보통</option>
                                <option value="LOW">낮음</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">담당자</label>
                            <select id="taskAssignee" class="form-select">
                                <option value="">미지정</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">기한</label>
                            <input type="date" id="taskDueDate" class="form-control">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">고정 여부</label>
                            <select id="taskIsPinned" class="form-select">
                                <option value="N">일반</option>
                                <option value="Y">고정</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="btnSaveTask">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/task-list.js"></script>
</body>
</html>
