<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영 작업 워크로드 | Grade-Stock Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="main-content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin">Home</a></li>
                <li class="breadcrumb-item"><a href="/admin/settings">시스템 설정</a></li>
                <li class="breadcrumb-item"><a href="/admin/settings/tasks">운영 작업</a></li>
                <li class="breadcrumb-item active">담당자별 워크로드</li>
            </ol>
        </nav>
        <div class="page-title-wrapper">
            <h1 class="page-title">담당자별 워크로드</h1>
            <a href="/admin/settings/tasks" class="btn btn-outline-secondary"><i class="fas fa-list me-2"></i>운영 작업 목록</a>
        </div>
        <div class="small text-muted mt-2 d-none" id="taskWorkloadSourceContextNotice" data-source-context=""></div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small mb-2">담당자 수</div>
                    <div class="stat-value" id="taskWorkloadAssigneeCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small mb-2">배정 작업</div>
                    <div class="stat-value" id="taskWorkloadAssignedTaskCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small mb-2">기한 초과</div>
                    <div class="stat-value" id="taskWorkloadOverdueTaskCount">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl">
            <div class="card summary-card shadow-sm">
                <div class="card-body">
                    <div class="text-muted small mb-2">미지정 작업</div>
                    <div class="stat-value" id="taskWorkloadUnassignedTaskCount">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label fw-bold">담당자/작업/메모 검색</label>
                    <input type="text" id="taskWorkloadKeyword" class="form-control" placeholder="담당자명, 작업명, 메모 검색">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">우선순위</label>
                    <select id="taskWorkloadPriority" class="form-select">
                        <option value="">전체</option>
                        <option value="HIGH">높음</option>
                        <option value="MEDIUM">보통</option>
                        <option value="LOW">낮음</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <div class="form-check mt-4 pt-2">
                        <input class="form-check-input" type="checkbox" id="taskWorkloadOverdueOnly">
                        <label class="form-check-label" for="taskWorkloadOverdueOnly">기한 초과만</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="button" class="btn btn-primary flex-fill" id="btnSearchTaskWorkload">조회</button>
                    <button type="button" class="btn btn-outline-secondary flex-fill" id="btnResetTaskWorkload">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card animate-in">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="card-title mb-0">담당자별 작업 분배</h6>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-outline-success btn-sm" id="btnExportTaskWorkloadCsv">
                    <i class="fas fa-file-csv me-1"></i>CSV 내보내기
                </button>
                <span class="small text-muted" id="taskWorkloadMetaText">데이터를 불러오는 중입니다...</span>
                <select id="taskWorkloadPageSize" class="form-select form-select-sm" style="width: auto;">
                    <option value="10">10개</option>
                    <option value="20">20개</option>
                    <option value="50">50개</option>
                </select>
            </div>
        </div>
        <div class="card-body border-bottom py-2">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="small text-muted" id="taskWorkloadFilterMeta">적용 필터를 계산하는 중입니다...</div>
                <div class="small text-muted" id="taskWorkloadResultMeta">결과 메타를 계산하는 중입니다...</div>
                <div class="small text-muted" id="taskWorkloadPageMeta">페이지 메타를 계산하는 중입니다...</div>
            </div>
            <div id="taskWorkloadStateMeta"
                 data-list-state="loading"
                 data-state-message="담당자별 워크로드를 불러오는 중입니다..."
                 data-total-elements="0"
                 data-visible-count="0"
                 data-filter-count="0"
                 data-query-signature=""
                 data-page-info-label=""
                 data-last-opened-admin-no=""
                 data-highlight-admin-no=""
                 data-source-context=""></div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4 table-col-80">No</th>
                        <th>담당자</th>
                        <th class="table-col-120 text-center">전체</th>
                        <th class="table-col-120 text-center">대기</th>
                        <th class="table-col-120 text-center">진행중</th>
                        <th class="table-col-120 text-center">기한 초과</th>
                        <th class="table-col-260">최근 메모</th>
                        <th class="text-end pe-4 table-col-260">관리</th>
                    </tr>
                    </thead>
                    <tbody id="taskWorkloadListBody">
                    <tr><td colspan="8" class="text-center py-5">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <nav aria-label="운영 작업 워크로드 페이지 이동">
                <ul class="pagination justify-content-center mb-0" id="taskWorkloadPagination"></ul>
            </nav>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/view/task-workload-list.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => TaskWorkloadList.init());</script>
</body>
</html>
