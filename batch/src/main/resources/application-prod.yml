server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  thymeleaf:
    check-template-location: false
  task:
    scheduling:
      pool:
        size: ${BATCH_SCHEDULING_POOL_SIZE:1}
      thread-name-prefix: batch-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: ${BATCH_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:3000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

batch:
  document-stats:
    enabled: ${BATCH_DOCUMENT_STATS_ENABLED:false}
    cron: ${BATCH_DOCUMENT_STATS_CRON:0 */10 * * * *}
