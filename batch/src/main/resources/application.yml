server:
  port: ${BATCH_SERVER_PORT:9091}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  thymeleaf:
    check-template-location: false

  task:
    scheduling:
      pool:
        size: ${BATCH_SCHEDULING_POOL_SIZE:1}
      thread-name-prefix: batch-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: ${BATCH_SHUTDOWN_TIMEOUT:30s}

  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/new_toy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false

batch:
  document-stats:
    enabled: ${BATCH_DOCUMENT_STATS_ENABLED:false}
    cron: ${BATCH_DOCUMENT_STATS_CRON:0 */10 * * * *}
  content-view-retention:
    enabled: ${BATCH_CONTENT_VIEW_RETENTION_ENABLED:false}
    cron: ${BATCH_CONTENT_VIEW_RETENTION_CRON:0 30 3 * * *}
    days: ${BATCH_CONTENT_VIEW_RETENTION_DAYS:180}
